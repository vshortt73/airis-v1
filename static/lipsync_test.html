<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lip Sync Test - Alina</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            overflow: hidden;
        }
        #container {
            display: flex;
            height: 100vh;
        }
        #canvas-container {
            flex: 1;
        }
        #controls-panel {
            width: 400px;
            background: #2a2a2a;
            border-left: 1px solid #444;
            display: flex;
            flex-direction: column;
        }
        .panel-header {
            padding: 20px;
            background: #333;
            border-bottom: 1px solid #444;
        }
        .panel-header h1 {
            font-size: 1.4rem;
            color: #bb86fc;
            margin-bottom: 5px;
        }
        .panel-header .subtitle {
            font-size: 0.9rem;
            color: #888;
        }
        .panel-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .input-group textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 5px;
            color: #e0e0e0;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
        }
        .input-group textarea:focus {
            outline: none;
            border-color: #bb86fc;
        }
        .speak-btn {
            width: 100%;
            padding: 12px;
            background: #bb86fc;
            color: #000;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .speak-btn:hover {
            background: #d4b3ff;
        }
        .speak-btn:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
        }
        .status {
            margin-top: 15px;
            padding: 12px;
            background: #333;
            border-radius: 5px;
            font-size: 0.85rem;
            border-left: 3px solid #03dac6;
        }
        .status.error {
            border-color: #ff4444;
            color: #ff4444;
        }
        .status.success {
            border-color: #03dac6;
            color: #03dac6;
        }
        .status.loading {
            border-color: #bb86fc;
            color: #bb86fc;
        }
        .phoneme-list {
            margin-top: 20px;
            padding: 12px;
            background: #333;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 0.75rem;
            font-family: monospace;
        }
        .phoneme-item {
            padding: 4px;
            margin: 2px 0;
            background: #1a1a1a;
            border-radius: 3px;
        }
        .phoneme-item.active {
            background: #bb86fc;
            color: #000;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-container"></div>

        <div id="controls-panel">
            <div class="panel-header">
                <h1>Lip Sync Test</h1>
                <div class="subtitle">Type text → Generate speech → See animation</div>
            </div>

            <div class="panel-body">
                <div class="input-group">
                    <label>Enter text to speak:</label>
                    <textarea id="text-input" placeholder="Hello! My name is Iris. How can I help you today?">Hello! My name is Iris.</textarea>
                </div>

                <button id="speak-btn" class="speak-btn">Generate & Speak</button>

                <div id="status" class="status" style="display: none;"></div>

                <div id="phoneme-list" class="phoneme-list" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { KHR_materials_pbrSpecularGlossiness } from 'three/addons/loaders/KHR_materials_pbrSpecularGlossiness.js';

        let scene, camera, renderer, controls;
        let avatarModel = null;
        let blendShapeMeshes = [];
        let jawBone = null;
        let jawInitialRotation = null;

        let phonemeMapping = null;
        let currentAudio = null;
        let animationFrame = null;

        // ============================================
        // SCENE SETUP
        // ============================================

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x2a2a2a);

            camera = new THREE.PerspectiveCamera(50, (window.innerWidth - 400) / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0.9, 1.2);
            camera.lookAt(0, 0.9, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth - 400, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 0.9, 0);
            controls.enableDamping = true;
            controls.update();

            // Bright lighting
            scene.add(new THREE.AmbientLight(0xffffff, 1.5));
            scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.0));

            const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
            keyLight.position.set(1, 1, 2);
            scene.add(keyLight);

            const faceLight = new THREE.PointLight(0xffffff, 1.0, 5);
            faceLight.position.set(0, 1.0, 1.5);
            scene.add(faceLight);
        }

        // ============================================
        // MODEL LOADING
        // ============================================

        function loadModel() {
            const loader = new GLTFLoader();
            // Register extension for older GLTF material format
            loader.register((parser) => new KHR_materials_pbrSpecularGlossiness(parser));

            loader.load('/assets/3D/alina/scene.gltf',
                (gltf) => {
                    avatarModel = gltf.scene;
                    scene.add(avatarModel);

                    avatarModel.traverse((node) => {
                        if (node.isBone && node.name === 'CC_Base_JawRoot_040') {
                            jawBone = node;
                            jawInitialRotation = jawBone.rotation.z;
                            console.log('[LipSync] Found jaw bone, initial rotation:', jawInitialRotation);
                        }

                        if (node.isMesh && node.morphTargetInfluences && node.morphTargetInfluences.length > 0) {
                            blendShapeMeshes.push(node);
                        }

                        // Fix texture color spaces
                        if (node.isMesh && node.material) {
                            const material = node.material;

                            // Set diffuse/base color textures to sRGB
                            if (material.map) {
                                material.map.colorSpace = THREE.SRGBColorSpace;
                                material.map.needsUpdate = true;
                            }

                            // Ensure normal maps stay in Linear space
                            if (material.normalMap) {
                                material.normalMap.colorSpace = THREE.LinearSRGBColorSpace;
                                material.normalMap.needsUpdate = true;
                            }

                            // Set other texture maps to Linear
                            if (material.roughnessMap) {
                                material.roughnessMap.colorSpace = THREE.LinearSRGBColorSpace;
                                material.roughnessMap.needsUpdate = true;
                            }
                            if (material.metalnessMap) {
                                material.metalnessMap.colorSpace = THREE.LinearSRGBColorSpace;
                                material.metalnessMap.needsUpdate = true;
                            }
                            if (material.emissiveMap) {
                                material.emissiveMap.colorSpace = THREE.SRGBColorSpace;
                                material.emissiveMap.needsUpdate = true;
                            }

                            material.needsUpdate = true;

                            node.castShadow = true;
                            node.receiveShadow = true;
                        }
                    });

                    console.log('[LipSync] Model loaded, blend shape meshes:', blendShapeMeshes.length);
                }
            );
        }

        // Load phoneme mapping
        async function loadPhonemeMapping() {
            const response = await fetch('/assets/3D/alina/alina_hybrid_phoneme_mapping.json');
            phonemeMapping = await response.json();
            console.log('[LipSync] Phoneme mapping loaded:', phonemeMapping);
        }

        // ============================================
        // ANIMATION FUNCTIONS
        // ============================================

        function setJawRotation(percent) {
            if (!jawBone || jawInitialRotation === null) return;
            const maxRotation = 0.5;
            const delta = (percent / 100) * maxRotation;
            jawBone.rotation.z = jawInitialRotation + delta;
        }

        function setBlendShapes(indices, value = 1.0) {
            // Reset all
            blendShapeMeshes.forEach(mesh => {
                for (let i = 0; i < mesh.morphTargetInfluences.length; i++) {
                    mesh.morphTargetInfluences[i] = 0;
                }
            });

            // Set specified
            indices.forEach(index => {
                blendShapeMeshes.forEach(mesh => {
                    if (index < mesh.morphTargetInfluences.length) {
                        mesh.morphTargetInfluences[index] = value;
                    }
                });
            });
        }

        function applyPhoneme(phonemeId) {
            if (!phonemeMapping || !phonemeMapping[phonemeId]) {
                console.warn('[LipSync] Unknown phoneme:', phonemeId);
                return;
            }

            const config = phonemeMapping[phonemeId];
            setJawRotation(config.jaw);
            setBlendShapes(config.blendShapes);
        }

        function resetMouth() {
            setJawRotation(0);
            setBlendShapes([]);
        }

        // ============================================
        // TTS & ANIMATION
        // ============================================

        async function generateAndSpeak(text) {
            const statusEl = document.getElementById('status');
            const speakBtn = document.getElementById('speak-btn');
            const phonemeListEl = document.getElementById('phoneme-list');

            statusEl.style.display = 'block';
            statusEl.className = 'status loading';
            statusEl.textContent = 'Generating speech and phonemes...';
            speakBtn.disabled = true;

            try {
                const response = await fetch('/api/tts/speak_with_phonemes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error || 'Unknown error');
                }

                console.log('[LipSync] Received:', data);

                statusEl.className = 'status success';
                statusEl.textContent = `Generated ${data.phonemes.length} phonemes. Playing...`;

                // Display phonemes
                phonemeListEl.style.display = 'block';
                phonemeListEl.innerHTML = data.phonemes.map((p, i) =>
                    `<div class="phoneme-item" id="phoneme-${i}">${p.start.toFixed(2)}s - ${p.end.toFixed(2)}s: ${p.value}</div>`
                ).join('');

                // Play audio with animation
                await playWithAnimation(data.audio, data.phonemes);

                statusEl.className = 'status success';
                statusEl.textContent = 'Done!';
                speakBtn.disabled = false;

            } catch (error) {
                console.error('[LipSync] Error:', error);
                statusEl.className = 'status error';
                statusEl.textContent = `Error: ${error.message}`;
                speakBtn.disabled = false;
            }
        }

        async function playWithAnimation(audioBase64, phonemes) {
            return new Promise((resolve, reject) => {
                // Decode base64 to audio
                const audioData = atob(audioBase64);
                const audioArray = new Uint8Array(audioData.length);
                for (let i = 0; i < audioData.length; i++) {
                    audioArray[i] = audioData.charCodeAt(i);
                }
                const audioBlob = new Blob([audioArray], { type: 'audio/wav' });  // WAV instead of MP3
                const audioUrl = URL.createObjectURL(audioBlob);

                currentAudio = new Audio(audioUrl);
                currentAudio.play();

                const startTime = performance.now();
                let currentPhonemeIndex = -1;

                function animate() {
                    const elapsed = (performance.now() - startTime) / 1000; // seconds

                    // Find current phoneme
                    const phoneme = phonemes.find(p => elapsed >= p.start && elapsed <= p.end);

                    if (phoneme) {
                        const phonemeIndex = phonemes.indexOf(phoneme);
                        if (phonemeIndex !== currentPhonemeIndex) {
                            // New phoneme - apply it
                            applyPhoneme(phoneme.value);
                            currentPhonemeIndex = phonemeIndex;

                            // Highlight in list
                            document.querySelectorAll('.phoneme-item').forEach(el => el.classList.remove('active'));
                            document.getElementById(`phoneme-${phonemeIndex}`)?.classList.add('active');
                        }
                    } else {
                        // Between phonemes or after - reset
                        if (currentPhonemeIndex !== -1) {
                            resetMouth();
                            currentPhonemeIndex = -1;
                            document.querySelectorAll('.phoneme-item').forEach(el => el.classList.remove('active'));
                        }
                    }

                    if (elapsed < (phonemes[phonemes.length - 1]?.end || 0) + 0.5) {
                        animationFrame = requestAnimationFrame(animate);
                    } else {
                        resetMouth();
                        resolve();
                    }
                }

                currentAudio.onended = () => {
                    if (animationFrame) cancelAnimationFrame(animationFrame);
                    resetMouth();
                    resolve();
                };

                currentAudio.onerror = (error) => {
                    if (animationFrame) cancelAnimationFrame(animationFrame);
                    resetMouth();
                    reject(error);
                };

                animate();
            });
        }

        // ============================================
        // ANIMATION LOOP
        // ============================================

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = (window.innerWidth - 400) / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth - 400, window.innerHeight);
        });

        // ============================================
        // EVENT HANDLERS
        // ============================================

        document.getElementById('speak-btn').addEventListener('click', () => {
            const text = document.getElementById('text-input').value.trim();
            if (text) {
                generateAndSpeak(text);
            }
        });

        // Allow Enter key to trigger
        document.getElementById('text-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                document.getElementById('speak-btn').click();
            }
        });

        // ============================================
        // INIT
        // ============================================

        initScene();
        loadModel();
        loadPhonemeMapping();
        animate();
    </script>
</body>
</html>
