<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Airis</title>

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- Application CSS -->
    <link rel="stylesheet" href="/static/css/main.css?v=2">
</head>
<body>
    <div class="header">
        <h1>Airis</h1>
        <div class="header-controls" style="display: flex; align-items: center; gap: 2rem;">
            <label class="speech-toggle">
                <input type="checkbox" id="speechToggle">
                <span class="speech-toggle-label">🔊 Voice</span>
                <span class="mobile-label">TTS</span>
            </label>

            <!-- VOX Controls -->
            <div class="vox-controls" style="display: flex; align-items: center; gap: 10px;">
                <!-- VOX Toggle Button -->
                <button id="voxToggle" onclick="IrisVOX.vox_button_toggle()"
                        style="background: none; border: none; font-size: 20px; cursor: pointer; padding: 0;"
                        title="Toggle microphone input">
                    🔇
                    <span class="mobile-label">MIC</span>
                </button>

                <!-- VOX Status -->
                <div style="display: flex; align-items: center; gap: 6px;">
                    <div id="vox-indicator"
                         style="width: 10px; height: 10px; border-radius: 50%; background: gray;">
                    </div>
                    <span id="vox-label" style="font-size: 11px; color: #888;">off</span>
                </div>

                <!-- VU Meter -->
                <div class="vu-meter" style="width: 80px; height: 6px; background: #333; border-radius: 3px; overflow: hidden;">
                    <div id="vu-fill" style="width: 0%; height: 100%; background: gray; transition: width 0.05s;"></div>
                </div>
            </div>

            <!-- Webcam Toggle -->
            <label class="speech-toggle" style="margin-left: 1rem;">
                <input type="checkbox" id="webcamToggle">
                <span class="speech-toggle-label">📷 Webcam</span>
                <span class="mobile-label">CAM</span>
            </label>

            <!-- Thinking Toggle -->
            <label class="speech-toggle" style="margin-left: 1rem;" title="Enable/disable model reasoning (affects inference speed)">
                <input type="checkbox" id="thinkingToggle" checked>
                <span class="speech-toggle-label">🧠 Think</span>
                <span class="mobile-label">THINK</span>
            </label>

            <!-- Meeting Record Button -->
            <button class="pip-launch-btn" id="meetingBtn" title="Start meeting recording" onclick="toggleMeetingRecording()">
                <span class="pip-btn-icon">🎙️</span><span class="pip-btn-text"> Meet</span>
                <span class="mobile-label">MEET</span>
            </button>
            <div id="meetingStatus" style="display: none; align-items: center; gap: 6px; font-size: 11px; color: #ff4444;">
                <span id="meetingTimer">0:00</span>
                <span id="meetingChunkCount"></span>
            </div>

            <!-- PiP Video Launch Button -->
            <button class="pip-launch-btn" id="pipLaunchBtn" title="Launch video player">
                <span class="pip-btn-icon">🎬</span><span class="pip-btn-text"> Video</span>
                <span class="mobile-label">VIDEO</span>
            </button>

            <div class="info">
                <span id="messageCount">Messages: 0</span> |
                <span id="tokenInfo" style="font-weight: bold; color: #5b9bd5;">Tokens: 0/32,768 (0%)</span> |
                <span id="protocolInfo" style="font-weight: bold; color: #4CAF50;">Protocol: Default</span> |
                <span id="sessionInfo">Session: ...</span>
            </div>
        </div>
    </div>

    <div class="status" id="status">Loading conversation history...</div>
    <div class="chat-container" id="chatContainer"></div>

    <!-- Webcam Preview -->
    <div class="webcam-preview" id="webcamPreview">
        <div class="webcam-preview-header" id="webcamPreviewHeader">
            <span class="webcam-preview-title">📷 Webcam Preview</span>
            <button class="webcam-preview-close" id="webcamPreviewClose" title="Close preview">×</button>
        </div>
        <video id="webcamPreviewVideo" autoplay muted playsinline></video>
        <div class="webcam-preview-status" id="webcamPreviewStatus">Waiting for webcam...</div>
    </div>

    <!-- PiP Video Player -->
    <div class="pip-container" id="pipContainer">
        <div class="pip-header" id="pipHeader">
            <span class="pip-header-title">Airis Video</span>
            <div class="pip-header-buttons">
                <button class="pip-header-btn" id="pipPopoutBtn" title="Pop out to window">↗</button>
                <button class="pip-header-btn" id="pipCloseBtn" title="Close">×</button>
            </div>
        </div>
        <div class="pip-video-wrapper">
            <video id="pip-loop-video" autoplay loop muted src="/static/loop.mp4"></video>
            <video id="pip-thinking-video" autoplay loop muted style="display: none;"></video>
            <video id="pip-video-player" autoplay></video>
            <video id="pip-video-player-b" autoplay></video>
        </div>
        <div class="pip-status" id="pipStatus">Ready</div>
        <div class="pip-queue-info" id="pipQueueInfo"></div>
        <div class="pip-controls">
            <button id="pipPrevBtn">← Prev</button>
            <button id="pipStopBtn">Stop</button>
            <button id="pipNextBtn">Next →</button>
            <select id="pipQualitySelect" title="Video quality (lower = faster on slow connections)">
                <option value="high">HD</option>
                <option value="medium">SD</option>
                <option value="low" selected>Low</option>
            </select>
        </div>
    </div>

    <div class="input-container">
        <div class="image-preview-container" id="imagePreviewContainer"></div>
        <div class="document-preview-container" id="documentPreviewContainer"></div>
        <div class="input-controls">
            <input type="file" id="imageUpload" accept="image/*" style="display: none;" multiple>
            <input type="file" id="documentUpload" accept=".pdf,.docx,.odt,.doc,.txt,.md" style="display: none;" multiple>
            <button id="uploadButton" title="Upload image">📎</button>
            <button id="documentUploadButton" title="Upload document (PDF, Word, ODT)">📄</button>
            <textarea id="messageInput" placeholder="Type or paste image..." disabled rows="1"></textarea>
            <button id="stopButton" title="Stop generation">⏹ Stop</button>
            <button id="sendButton" disabled>Send</button>
        </div>
    </div>

    <!-- Application JavaScript - Load Order Matters! -->
    <script src="/static/audio_in.js?ver=1.4"></script>
    <script src="/static/js/tts-queue.js"></script>
    <script src="/static/js/pip-player.js?ver=1.2"></script>
    <script src="/static/js/meeting-recorder.js?ver=1.0"></script>
    <script src="/static/js/main.js?v=3"></script>
</body>
</html>
