<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris v3</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #2a2a2a;
            padding: 1rem;
            border-bottom: 1px solid #3a3a3a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 1.5rem; color: #bb86fc; }
        .info { font-size: 0.85rem; color: #888; }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .message {
            display: flex;
            gap: 0.75rem;
            max-width: 80%;
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.assistant { align-self: flex-start; }
        .message.system { align-self: center; max-width: 90%; }
        
        /* Tool status styling */
        .tool-status {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            align-self: flex-start;
            padding: 0.5rem 1rem;
            background: #2a2a2a;
            border-radius: 1rem;
            border-left: 3px solid #bb86fc;
            animation: fadeIn 0.3s ease-in;
        }
        .tool-status-icon {
            font-size: 1.5rem;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .tool-status-text {
            font-size: 0.9rem;
            color: #bb86fc;
        }
        
        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }
        .message.user .message-avatar { background: #03dac6; color: #000; }
        .message.assistant .message-avatar { background: #bb86fc; color: #000; }
        .message.system .message-avatar { background: #555; color: #aaa; }
        .message-content {
            background: #2a2a2a;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            line-height: 1.5;
            word-wrap: break-word;
        }
        /* Markdown styling */
        .message-content p { margin: 0.5em 0; }
        .message-content p:first-child { margin-top: 0; }
        .message-content p:last-child { margin-bottom: 0; }
        .message-content strong { font-weight: bold; color: #fff; }
        .message-content em { font-style: italic; }
        .message-content code {
            background: #1a1a1a;
            padding: 0.2em 0.4em;
            border-radius: 0.25rem;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        .message-content pre {
            background: #282c34;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 0.5em 0;
            position: relative;
            padding-top: 2.5rem;  /* Make room for copy button */
        }
        .message-content pre code {
            background: none;
            padding: 0;
            display: block;
            overflow-x: auto;
        }
        /* Syntax highlighting adjustments */
        .message-content pre code.hljs {
            background: #282c34;
            padding: 0;
        }
        /* Copy button styling */
        .code-copy-button {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: #3a3f4b;
            color: #abb2bf;
            border: 1px solid #4b5263;
            border-radius: 0.25rem;
            padding: 0.4rem 0.8rem;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            z-index: 10;
        }
        .code-copy-button:hover {
            background: #4b5263;
            border-color: #5c6370;
            color: #fff;
        }
        .code-copy-button.copied {
            background: #03dac6;
            border-color: #03dac6;
            color: #000;
        }
        .code-copy-button:active {
            transform: scale(0.95);
        }
        .message-content ul, .message-content ol {
            margin: 0.5em 0;
            padding-left: 1.5em;
        }
        .message-content li { margin: 0.25em 0; }
        .message-content blockquote {
            border-left: 3px solid #bb86fc;
            padding-left: 1em;
            margin: 0.5em 0;
            color: #aaa;
        }
        .message-content a {
            color: #03dac6;
            text-decoration: none;
        }
        .message-content a:hover { text-decoration: underline; }
        .message.user .message-content { background: #03dac6; color: #000; }
        .message.system .message-content { 
            background: #333; 
            color: #888; 
            font-size: 0.85rem;
            font-style: italic;
            text-align: center;
        }
        .input-container {
            background: #2a2a2a;
            padding: 1rem;
            border-top: 1px solid #3a3a3a;
        }
        .image-preview-container {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            flex-wrap: wrap;
        }
        .image-preview {
            position: relative;
            width: 100px;
            height: 100px;
            border: 2px solid #bb86fc;
            border-radius: 0.5rem;
            overflow: hidden;
        }
        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .image-preview-remove {
            position: absolute;
            top: 4px;
            right: 4px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            padding: 0;
        }
        .input-controls {
            display: flex;
            gap: 0.5rem;
        }
        #messageInput {
            flex: 1;
            padding: 0.75rem;
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            border-radius: 0.5rem;
            color: #e0e0e0;
            font-size: 1rem;
        }
        #messageInput:focus { outline: none; border-color: #bb86fc; }
        button {
            padding: 0.75rem 1.5rem;
            background: #bb86fc;
            color: #000;
            border: none;
            border-radius: 0.5rem;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #d4b3ff; }
        button:disabled { background: #555; cursor: not-allowed; }
        .status {
            text-align: center;
            padding: 0.5rem;
            font-size: 0.85rem;
            color: #888;
        }
        .status.connected { color: #03dac6; }
        .status.loading { color: #bb86fc; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Iris v3</h1>
        <div class="info">
            <span id="messageCount">Messages: 0</span> | 
            <span id="sessionInfo">Session: ...</span>
        </div>
    </div>
    
    <div class="status" id="status">Loading conversation history...</div>
    <div class="chat-container" id="chatContainer"></div>
    
    <div class="input-container">
        <div class="image-preview-container" id="imagePreviewContainer"></div>
        <div class="input-controls">
            <input type="file" id="imageUpload" accept="image/*" style="display: none;" multiple>
            <button id="uploadButton" title="Upload image">📎</button>
            <input type="text" id="messageInput" placeholder="Type or paste image..." disabled>
            <button id="sendButton" disabled>Send</button>
        </div>
    </div>
    
    <script>
let pendingToolStatus = null;
        // Configure marked.js with syntax highlighting
        marked.setOptions({
            breaks: true,        // Convert \n to <br>
            gfm: true,          // GitHub Flavored Markdown
            headerIds: false,   // Don't add IDs to headers
            mangle: false,      // Don't escape email addresses
            highlight: function(code, lang) {
                // Use highlight.js for syntax highlighting
                if (lang && hljs.getLanguage(lang)) {
                    try {
                        return hljs.highlight(code, { language: lang }).value;
                    } catch (err) {
                        console.error('Highlighting error:', err);
                    }
                }
                // Auto-detect language if not specified
                try {
                    return hljs.highlightAuto(code).value;
                } catch (err) {
                    console.error('Auto-highlighting error:', err);
                }
                return code; // Fallback to plain code
            }
        });

        let ws = null;
        let isStreaming = false;
        let currentAssistantMessage = null;
        let currentAssistantText = '';  // Accumulate text for markdown parsing
        let attachedImages = []; // Store base64 images
        
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const uploadButton = document.getElementById('uploadButton');
        const imageUpload = document.getElementById('imageUpload');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const statusDiv = document.getElementById('status');
        const messageCount = document.getElementById('messageCount');
        const sessionInfo = document.getElementById('sessionInfo');
        
        // Image handling functions
        function imageToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
        
        function addImagePreview(base64Data) {
            const previewDiv = document.createElement('div');
            previewDiv.className = 'image-preview';
            
            const img = document.createElement('img');
            img.src = base64Data;
            
            const removeBtn = document.createElement('button');
            removeBtn.className = 'image-preview-remove';
            removeBtn.textContent = '×';
            removeBtn.onclick = () => {
                const index = attachedImages.indexOf(base64Data);
                if (index > -1) {
                    attachedImages.splice(index, 1);
                }
                previewDiv.remove();
            };
            
            previewDiv.appendChild(img);
            previewDiv.appendChild(removeBtn);
            imagePreviewContainer.appendChild(previewDiv);
        }
        
        // Upload button click
        uploadButton.addEventListener('click', () => {
            imageUpload.click();
        });
        
        // Handle file selection
        imageUpload.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            
            for (const file of files) {
                if (file.type.startsWith('image/')) {
                    const base64 = await imageToBase64(file);
                    attachedImages.push(base64);
                    addImagePreview(base64);
                }
            }
            
            // Clear file input
            imageUpload.value = '';
        });
        
        // Handle paste events for images
        messageInput.addEventListener('paste', async (e) => {
            const items = Array.from(e.clipboardData.items);
            
            for (const item of items) {
                if (item.type.startsWith('image/')) {
                    e.preventDefault();
                    const file = item.getAsFile();
                    const base64 = await imageToBase64(file);
                    attachedImages.push(base64);
                    addImagePreview(base64);
                }
            }
        });
        
        async function loadConversationHistory() {
            try {
                statusDiv.textContent = 'Loading conversation history...';
                statusDiv.className = 'status loading';
                
                const response = await fetch('/api/conversation/context');
                const data = await response.json();
                
                if (data.messages && data.messages.length > 0) {
                    // Skip system message (first one), show only conversation
                    const conversationMessages = data.messages.slice(1);
                    
                    conversationMessages.forEach(msg => {
                        if (msg.role === 'user' || msg.role === 'assistant') {
                            // Check if message has images (attachments field with base64 data)
                            let images = [];
                            if (msg.images && Array.isArray(msg.images)) {
                                // Images are already base64 encoded
                                images = msg.images;
                            }
                            
                            const messageDiv = createMessage(msg.role, msg.content, images);
                            messageDiv.style.animation = 'none'; // Don't animate history
                            chatContainer.appendChild(messageDiv);
                        }
                    });
                    
                    // Add separator
                    if (conversationMessages.length > 0) {
                        const separator = createMessage('system', '─── Conversation continues ───');
                        separator.style.animation = 'none';
                        chatContainer.appendChild(separator);
                    }
                    
                    scrollToBottom();
                    console.log(`Loaded ${conversationMessages.length} messages from history`);
                }
                
                // Update info
                messageCount.textContent = `Messages: ${data.message_count || 0}`;
                if (data.session_id) {
                    sessionInfo.textContent = `Session: ${data.session_id.substring(0, 8)}...`;
                }
                
                statusDiv.textContent = '';
                statusDiv.className = 'status';
                
            } catch (error) {
                console.error('Failed to load history:', error);
                statusDiv.textContent = 'Failed to load history';
                statusDiv.className = 'status';
            }
        }
        
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/chat`);
            
            ws.onopen = () => {
                statusDiv.textContent = 'Connected';
                statusDiv.className = 'status connected';
                messageInput.disabled = false;
                sendButton.disabled = false;
                messageInput.focus();
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                switch(data.type) {
                    case 'start':
                        isStreaming = true;
                        sendButton.disabled = true;
                        currentAssistantText = '';  // Reset accumulated text
                        currentAssistantMessage = createMessage('assistant', 'Iris is thinking...');
                        chatContainer.appendChild(currentAssistantMessage);
                        scrollToBottom();
                        break;
                    
                    case 'tool_start':
                        // Ollama decided to use tools
                        console.log(`Using ${data.tool_count} tool(s)`);
                        break;
                    
                    case 'tool_executing':
                        // Tool is being executed - show icon and "Working..."
                        const toolIcon = data.tool_icon || '🔧';
                        const toolName = data.tool_name || 'tool';
                        const toolStatus = createToolStatus(toolIcon, toolName);
                        currentAssistantMessage.appendChild(toolStatus);
                        scrollToBottom();
                        break;
                    
                    case 'tool_result':
                        // Tool completed - update the status
                        const lastToolStatus = chatContainer.querySelector('.tool-status:last-of-type');
                        if (lastToolStatus) {
                            const statusText = lastToolStatus.querySelector('.tool-status-text');
                            if (data.success) {
                                statusText.textContent = `${data.tool_name} ✓`;
                                statusText.style.color = '#03dac6';
                                // Stop the pulse animation
                                const icon = lastToolStatus.querySelector('.tool-status-icon');
                                icon.style.animation = 'none';
                            } else {
                                statusText.textContent = `${data.tool_name} failed: ${data.error}`;
                                statusText.style.color = '#ff4444';
                                const icon = lastToolStatus.querySelector('.tool-status-icon');
                                icon.style.animation = 'none';
                            }
                        }
                        break;
                        
                    case 'chunk':
                        if (currentAssistantMessage) {
                            // Accumulate the text
                            currentAssistantText += data.content;

                            // Parse accumulated markdown and render
                            const content = currentAssistantMessage.querySelector('.message-content');
                            const textSpan = content.querySelector('span');
                            if (textSpan) {
                                // Parse markdown to HTML
                                textSpan.innerHTML = marked.parse(currentAssistantText);

                                // Add copy buttons to any code blocks
                                addCopyButtonsToCodeBlocks(textSpan);
                            }
                            scrollToBottom();
                        }
                        break;
                        
                    case 'done':
                        isStreaming = false;
                        sendButton.disabled = false;
                        currentAssistantMessage = null;
                        currentAssistantText = '';  // Clear accumulated text
                        messageCount.textContent = `Messages: ${data.message_count}`;
                        messageInput.focus();
                        break;
                        
                    case 'error':
                        statusDiv.textContent = `Error: ${data.content}`;
                        statusDiv.className = 'status';
                        isStreaming = false;
                        sendButton.disabled = false;
                        break;
                }
            };
            
            ws.onerror = () => {
                statusDiv.textContent = 'Connection error';
                statusDiv.className = 'status';
            };
            
            ws.onclose = () => {
                statusDiv.textContent = 'Disconnected - Reconnecting...';
                statusDiv.className = 'status';
                messageInput.disabled = true;
                sendButton.disabled = true;
                setTimeout(connectWebSocket, 2000);
            };
        }
        
        function createToolStatus(icon, toolName) {
            const statusDiv = document.createElement('div');
            statusDiv.className = 'tool-status';
            
            const iconSpan = document.createElement('span');
            iconSpan.className = 'tool-status-icon';
            iconSpan.textContent = icon;
            
            const textSpan = document.createElement('span');
            textSpan.className = 'tool-status-text';
            textSpan.textContent = `${toolName} working...`;
            
            statusDiv.appendChild(iconSpan);
            statusDiv.appendChild(textSpan);
            return statusDiv;
        }
        
        function createMessage(role, content, images = []) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            if (role === 'user') {
                avatar.textContent = 'V';
            } else if (role === 'assistant') {
                avatar.textContent = 'I';
            } else if (role === 'system') {
                avatar.textContent = '•';
            }
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            // Add images if present
            if (images && images.length > 0) {
                const imagesContainer = document.createElement('div');
                imagesContainer.style.display = 'flex';
                imagesContainer.style.gap = '0.5rem';
                imagesContainer.style.marginBottom = content ? '0.5rem' : '0';
                imagesContainer.style.flexWrap = 'wrap';
                
                images.forEach(imgData => {
                    const img = document.createElement('img');
                    img.src = imgData;
                    img.style.maxWidth = '200px';
                    img.style.maxHeight = '200px';
                    img.style.borderRadius = '0.5rem';
                    img.style.objectFit = 'cover';
                    imagesContainer.appendChild(img);
                });
                
                contentDiv.appendChild(imagesContainer);
            }
            
            // Add text content if present
            if (content) {
                const textSpan = document.createElement('span');
                // Parse markdown for all messages (including loaded history)
                textSpan.innerHTML = marked.parse(content);

                // Add copy buttons to code blocks
                addCopyButtonsToCodeBlocks(textSpan);

                contentDiv.appendChild(textSpan);
            }
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            return messageDiv;
        }
        
        function sendMessage() {
            if (isStreaming || !ws || ws.readyState !== WebSocket.OPEN) return;
            
            const message = messageInput.value.trim();
            if (!message && attachedImages.length === 0) return;
            
            // Create user message display WITH images
            const userMsgDiv = createMessage('user', message || '', attachedImages);
            chatContainer.appendChild(userMsgDiv);
            scrollToBottom();
            
            // Send to WebSocket with images
            const payload = {
                message: message || '(attached image)',
                images: attachedImages.length > 0 ? attachedImages : undefined
            };
            
            console.log(`Sending message with ${attachedImages.length} image(s)`);
            ws.send(JSON.stringify(payload));
            
            // Clear input and images
            messageInput.value = '';
            attachedImages = [];
            imagePreviewContainer.innerHTML = '';
        }
        
        function addCopyButtonsToCodeBlocks(container) {
            // Find all code blocks in the container
            const codeBlocks = container.querySelectorAll('pre code');

            codeBlocks.forEach((codeBlock) => {
                const pre = codeBlock.parentElement;

                // Skip if button already exists
                if (pre.querySelector('.code-copy-button')) {
                    return;
                }

                // Create copy button
                const button = document.createElement('button');
                button.className = 'code-copy-button';
                button.innerHTML = '<span>📋</span><span>Copy</span>';

                // Add click handler
                button.addEventListener('click', async () => {
                    const code = codeBlock.textContent;

                    try {
                        await navigator.clipboard.writeText(code);

                        // Show success feedback
                        button.innerHTML = '<span>✓</span><span>Copied!</span>';
                        button.classList.add('copied');

                        // Reset after 2 seconds
                        setTimeout(() => {
                            button.innerHTML = '<span>📋</span><span>Copy</span>';
                            button.classList.remove('copied');
                        }, 2000);
                    } catch (err) {
                        console.error('Failed to copy:', err);
                        button.innerHTML = '<span>✗</span><span>Failed</span>';
                        setTimeout(() => {
                            button.innerHTML = '<span>📋</span><span>Copy</span>';
                        }, 2000);
                    }
                });

                pre.appendChild(button);
            });
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        // Initialize: Load history first, then connect WebSocket
        loadConversationHistory().then(() => {
            connectWebSocket();
        });
    </script>
</body>
</html>
