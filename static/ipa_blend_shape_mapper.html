<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPA → Alina Blend Shape Mapper</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            overflow: hidden;
        }
        #container {
            display: flex;
            height: 100vh;
        }
        #canvas-container {
            flex: 1;
        }
        #controls-panel {
            width: 450px;
            background: #2a2a2a;
            border-left: 1px solid #444;
            display: flex;
            flex-direction: column;
        }
        .panel-header {
            padding: 20px;
            background: #333;
            border-bottom: 1px solid #444;
        }
        .panel-header h1 {
            font-size: 1.4rem;
            color: #bb86fc;
            margin-bottom: 5px;
        }
        .panel-header .subtitle {
            font-size: 0.9rem;
            color: #888;
        }
        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .phoneme-section {
            margin-bottom: 25px;
            padding: 15px;
            background: #333;
            border-radius: 8px;
            border-left: 3px solid #03dac6;
        }
        .phoneme-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .phoneme-symbol {
            font-size: 1.8rem;
            font-weight: bold;
            color: #03dac6;
            font-family: 'Courier New', monospace;
        }
        .phoneme-examples {
            font-size: 0.85rem;
            color: #aaa;
            font-style: italic;
        }
        .phoneme-category {
            display: inline-block;
            padding: 3px 8px;
            background: #1a1a1a;
            border-radius: 3px;
            font-size: 0.75rem;
            color: #bb86fc;
            margin-bottom: 8px;
        }
        .control-group {
            margin-bottom: 12px;
        }
        .control-group label {
            display: block;
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 5px;
        }
        .jaw-slider {
            width: 100%;
            margin-bottom: 5px;
        }
        .jaw-value {
            font-size: 0.8rem;
            color: #03dac6;
        }
        .blend-shape-input {
            width: 100%;
            padding: 8px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 0.9rem;
        }
        .test-btn {
            width: 100%;
            padding: 8px;
            background: #bb86fc;
            color: #000;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        .test-btn:hover {
            background: #d4b3ff;
        }
        .save-panel {
            padding: 20px;
            background: #333;
            border-top: 1px solid #444;
        }
        .save-btn {
            width: 100%;
            padding: 15px;
            background: #03dac6;
            color: #000;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .save-btn:hover {
            background: #05f0d8;
        }
        .progress-info {
            margin-bottom: 10px;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 4px;
            text-align: center;
            font-size: 0.9rem;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #1a1a1a;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #bb86fc, #03dac6);
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-container"></div>

        <div id="controls-panel">
            <div class="panel-header">
                <h1>IPA Phoneme Mapper</h1>
                <div class="subtitle">Map 44 English phonemes to Alina blend shapes</div>
            </div>

            <div class="panel-body" id="phoneme-list">
                <!-- Phoneme controls will be generated here -->
            </div>

            <div class="save-panel">
                <div class="progress-info">
                    <span id="mapped-count">0</span> / <span id="total-count">44</span> phonemes mapped
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <button class="save-btn" id="save-btn">Save Mapping to JSON</button>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // IPA Phonemes for American English
        const IPA_PHONEMES = [
            // Vowels
            { ipa: 'i', category: 'Vowel - High Front', examples: 'beet, see, meet' },
            { ipa: 'ɪ', category: 'Vowel - Near-High Front', examples: 'bit, sit, kit' },
            { ipa: 'e', category: 'Vowel - Mid Front', examples: 'gate, say (monophthong)' },
            { ipa: 'ɛ', category: 'Vowel - Low-Mid Front', examples: 'bet, set, met' },
            { ipa: 'æ', category: 'Vowel - Near-Low Front', examples: 'bat, cat, hat' },
            { ipa: 'ɑ', category: 'Vowel - Low Back', examples: 'father, hot, pot' },
            { ipa: 'ɔ', category: 'Vowel - Low-Mid Back', examples: 'caught, law, dog' },
            { ipa: 'o', category: 'Vowel - Mid Back', examples: 'boat, so (monophthong)' },
            { ipa: 'ʊ', category: 'Vowel - Near-High Back', examples: 'book, put, foot' },
            { ipa: 'u', category: 'Vowel - High Back', examples: 'boot, food, soon' },
            { ipa: 'ʌ', category: 'Vowel - Mid Central', examples: 'but, cup, cut' },
            { ipa: 'ə', category: 'Vowel - Schwa', examples: 'about, sofa, banana' },
            { ipa: 'ɚ', category: 'Vowel - R-colored Schwa', examples: 'butter, letter, over' },
            { ipa: 'ɝ', category: 'Vowel - R-colored Mid', examples: 'bird, fern, her' },

            // Diphthongs
            { ipa: 'eɪ', category: 'Diphthong', examples: 'day, say, gate' },
            { ipa: 'aɪ', category: 'Diphthong', examples: 'my, buy, high' },
            { ipa: 'ɔɪ', category: 'Diphthong', examples: 'boy, toy, coin' },
            { ipa: 'aʊ', category: 'Diphthong', examples: 'now, how, cow' },
            { ipa: 'oʊ', category: 'Diphthong', examples: 'go, so, boat' },

            // Consonants - Stops
            { ipa: 'p', category: 'Consonant - Voiceless Bilabial Stop', examples: 'pat, cap, spin' },
            { ipa: 'b', category: 'Consonant - Voiced Bilabial Stop', examples: 'bat, cab, rib' },
            { ipa: 't', category: 'Consonant - Voiceless Alveolar Stop', examples: 'tap, cat, stick' },
            { ipa: 'd', category: 'Consonant - Voiced Alveolar Stop', examples: 'dog, sad, did' },
            { ipa: 'k', category: 'Consonant - Voiceless Velar Stop', examples: 'cat, back, school' },
            { ipa: 'g', category: 'Consonant - Voiced Velar Stop', examples: 'go, bag, dog' },

            // Consonants - Fricatives
            { ipa: 'f', category: 'Consonant - Voiceless Labiodental Fricative', examples: 'fat, calf, phone' },
            { ipa: 'v', category: 'Consonant - Voiced Labiodental Fricative', examples: 'van, have, of' },
            { ipa: 'θ', category: 'Consonant - Voiceless Dental Fricative', examples: 'think, bath, path' },
            { ipa: 'ð', category: 'Consonant - Voiced Dental Fricative', examples: 'this, bathe, father' },
            { ipa: 's', category: 'Consonant - Voiceless Alveolar Fricative', examples: 'sit, pass, cats' },
            { ipa: 'z', category: 'Consonant - Voiced Alveolar Fricative', examples: 'zip, has, dogs' },
            { ipa: 'ʃ', category: 'Consonant - Voiceless Postalveolar Fricative', examples: 'ship, cash, nation' },
            { ipa: 'ʒ', category: 'Consonant - Voiced Postalveolar Fricative', examples: 'measure, vision, beige' },
            { ipa: 'h', category: 'Consonant - Voiceless Glottal Fricative', examples: 'hat, ahead, who' },

            // Consonants - Affricates
            { ipa: 'tʃ', category: 'Consonant - Voiceless Postalveolar Affricate', examples: 'church, match, nature' },
            { ipa: 'dʒ', category: 'Consonant - Voiced Postalveolar Affricate', examples: 'judge, age, joy' },

            // Consonants - Nasals
            { ipa: 'm', category: 'Consonant - Bilabial Nasal', examples: 'man, ham, mom' },
            { ipa: 'n', category: 'Consonant - Alveolar Nasal', examples: 'no, can, nun' },
            { ipa: 'ŋ', category: 'Consonant - Velar Nasal', examples: 'sing, bank, thing' },

            // Consonants - Approximants
            { ipa: 'w', category: 'Consonant - Labial-Velar Approximant', examples: 'we, away, quick' },
            { ipa: 'j', category: 'Consonant - Palatal Approximant', examples: 'yes, you, onion' },
            { ipa: 'l', category: 'Consonant - Alveolar Lateral Approximant', examples: 'let, ball, fly' },
            { ipa: 'r', category: 'Consonant - Alveolar Approximant', examples: 'red, car, three' },

            // Silence
            { ipa: 'X', category: 'Silence', examples: 'pause, rest, silence' },
        ];

        let scene, camera, renderer, controls;
        let avatarModel = null;
        let blendShapeMeshes = [];
        let jawBone = null;
        let jawInitialRotation = null;

        // Phoneme mapping storage
        let phonemeMapping = {};

        // ============================================
        // SCENE SETUP
        // ============================================

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x2a2a2a);

            camera = new THREE.PerspectiveCamera(50, (window.innerWidth - 450) / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0.9, 1.2);
            camera.lookAt(0, 0.9, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth - 450, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 0.9, 0);
            controls.enableDamping = true;
            controls.update();

            // Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 1.5));
            scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.0));

            const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
            keyLight.position.set(1, 1, 2);
            scene.add(keyLight);

            const faceLight = new THREE.PointLight(0xffffff, 1.0, 5);
            faceLight.position.set(0, 1.0, 1.5);
            scene.add(faceLight);
        }

        // ============================================
        // MODEL LOADING
        // ============================================

        async function loadModel() {
            const loader = new GLTFLoader();

            loader.load('/assets/3D/alina/scene.gltf',
                async (gltf) => {
                    await loadAndApplyTextures(gltf);

                    avatarModel = gltf.scene;
                    scene.add(avatarModel);

                    avatarModel.traverse((node) => {
                        if (node.isBone && node.name === 'CC_Base_JawRoot_040') {
                            jawBone = node;
                            jawInitialRotation = jawBone.rotation.z;
                        }

                        if (node.isMesh && node.morphTargetInfluences && node.morphTargetInfluences.length > 0) {
                            blendShapeMeshes.push(node);
                        }

                        // Enable shadows
                        if (node.isMesh) {
                            node.castShadow = true;
                            node.receiveShadow = true;
                        }
                    });

                    console.log('[IPA Mapper] Model loaded, jaw bone found:', !!jawBone);
                    console.log('[IPA Mapper] Blend shape meshes found:', blendShapeMeshes.length);
                },
                undefined,
                (error) => {
                    console.error('[IPA Mapper] Error loading model:', error);
                }
            );
        }

        async function loadAndApplyTextures(gltf) {
            // Manual texture loading since the loader doesn't support KHR_materials_pbrSpecularGlossiness
            const textureLoader = new THREE.TextureLoader();
            const basePath = '/assets/3D/alina/';

            // Load GLTF JSON to get texture mappings
            const response = await fetch(basePath + 'scene.gltf');
            const gltfJson = await response.json();

            // Create texture mapping from GLTF data
            const materials = gltfJson.materials;
            const images = gltfJson.images;
            const textures = gltfJson.textures;

            console.log('[IPA Mapper] Loading textures for', materials.length, 'materials');

            // Process each material
            for (let i = 0; i < materials.length; i++) {
                const matData = materials[i];
                const matName = matData.name;

                // Find the Three.js material
                let threeMaterial = null;
                gltf.scene.traverse((node) => {
                    if (node.isMesh && node.material && node.material.name === matName) {
                        threeMaterial = node.material;
                    }
                });

                if (!threeMaterial) continue;

                console.log('[IPA Mapper] Processing material:', matName);

                // Get diffuse texture from extension
                const ext = matData.extensions?.KHR_materials_pbrSpecularGlossiness;
                if (ext && ext.diffuseTexture) {
                    const texIndex = ext.diffuseTexture.index;
                    const imageIndex = textures[texIndex].source;
                    const imageUri = images[imageIndex].uri;

                    console.log('[IPA Mapper]   Loading diffuse:', imageUri);

                    try {
                        const texture = await textureLoader.loadAsync(basePath + imageUri);
                        texture.colorSpace = THREE.SRGBColorSpace;
                        texture.flipY = false; // GLTF uses bottom-left origin
                        threeMaterial.map = texture;
                        threeMaterial.needsUpdate = true;
                    } catch (error) {
                        console.error('[IPA Mapper]   Failed to load texture:', imageUri, error);
                    }
                }

                // Get normal texture
                if (matData.normalTexture) {
                    const texIndex = matData.normalTexture.index;
                    const imageIndex = textures[texIndex].source;
                    const imageUri = images[imageIndex].uri;

                    console.log('[IPA Mapper]   Loading normal:', imageUri);

                    try {
                        const texture = await textureLoader.loadAsync(basePath + imageUri);
                        texture.colorSpace = THREE.LinearSRGBColorSpace;
                        texture.flipY = false;
                        threeMaterial.normalMap = texture;
                        threeMaterial.needsUpdate = true;
                    } catch (error) {
                        console.error('[IPA Mapper]   Failed to load normal:', imageUri, error);
                    }
                }
            }

            console.log('[IPA Mapper] Texture loading complete');
        }

        // ============================================
        // ANIMATION FUNCTIONS
        // ============================================

        function setJawRotation(percent) {
            if (!jawBone || jawInitialRotation === null) return;
            const maxRotation = 0.5;
            const delta = (percent / 100) * maxRotation;
            jawBone.rotation.z = jawInitialRotation + delta;
        }

        function setBlendShapes(indices, value = 1.0) {
            blendShapeMeshes.forEach(mesh => {
                for (let i = 0; i < mesh.morphTargetInfluences.length; i++) {
                    mesh.morphTargetInfluences[i] = 0;
                }
            });

            indices.forEach(index => {
                blendShapeMeshes.forEach(mesh => {
                    if (index < mesh.morphTargetInfluences.length) {
                        mesh.morphTargetInfluences[index] = value;
                    }
                });
            });
        }

        function resetMouth() {
            setJawRotation(0);
            setBlendShapes([]);
        }

        // ============================================
        // UI GENERATION
        // ============================================

        function generatePhonemeUI() {
            const container = document.getElementById('phoneme-list');

            IPA_PHONEMES.forEach(phoneme => {
                const section = document.createElement('div');
                section.className = 'phoneme-section';

                section.innerHTML = `
                    <div class="phoneme-category">${phoneme.category}</div>
                    <div class="phoneme-header">
                        <div class="phoneme-symbol">/${phoneme.ipa}/</div>
                    </div>
                    <div class="phoneme-examples">${phoneme.examples}</div>

                    <div class="control-group">
                        <label>Jaw Opening (0-100%)</label>
                        <input type="range" class="jaw-slider" min="0" max="100" value="0"
                               data-ipa="${phoneme.ipa}">
                        <div class="jaw-value" id="jaw-value-${phoneme.ipa}">0%</div>
                    </div>

                    <div class="control-group">
                        <label>Blend Shape Indices (comma-separated, e.g., 1,2,5)</label>
                        <input type="text" class="blend-shape-input"
                               placeholder="e.g., 5,6,7"
                               data-ipa="${phoneme.ipa}">
                    </div>

                    <button class="test-btn" data-ipa="${phoneme.ipa}">Test This Phoneme</button>
                `;

                container.appendChild(section);

                // Event listeners
                const jawSlider = section.querySelector('.jaw-slider');
                const jawValue = section.querySelector(`#jaw-value-${phoneme.ipa}`);
                const blendInput = section.querySelector('.blend-shape-input');
                const testBtn = section.querySelector('.test-btn');

                jawSlider.addEventListener('input', (e) => {
                    const value = e.target.value;
                    jawValue.textContent = `${value}%`;
                    updateMapping(phoneme.ipa);
                    updateProgress();
                });

                blendInput.addEventListener('input', () => {
                    updateMapping(phoneme.ipa);
                    updateProgress();
                });

                testBtn.addEventListener('click', () => {
                    testPhoneme(phoneme.ipa);
                });
            });

            updateProgress();
        }

        function updateMapping(ipa) {
            const jawSlider = document.querySelector(`.jaw-slider[data-ipa="${ipa}"]`);
            const blendInput = document.querySelector(`.blend-shape-input[data-ipa="${ipa}"]`);

            const jaw = parseInt(jawSlider.value);
            const blendShapesText = blendInput.value.trim();
            const blendShapes = blendShapesText ? blendShapesText.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n)) : [];

            phonemeMapping[ipa] = {
                jaw: jaw,
                blendShapes: blendShapes
            };
        }

        function testPhoneme(ipa) {
            const config = phonemeMapping[ipa];
            if (!config) return;

            resetMouth();
            setTimeout(() => {
                setJawRotation(config.jaw);
                setBlendShapes(config.blendShapes);
            }, 100);

            setTimeout(resetMouth, 1000);
        }

        function updateProgress() {
            const mapped = Object.keys(phonemeMapping).filter(ipa => {
                const config = phonemeMapping[ipa];
                return config && (config.jaw > 0 || config.blendShapes.length > 0);
            }).length;

            document.getElementById('mapped-count').textContent = mapped;
            document.getElementById('total-count').textContent = IPA_PHONEMES.length;

            const percent = (mapped / IPA_PHONEMES.length) * 100;
            document.getElementById('progress-fill').style.width = `${percent}%`;
        }

        // ============================================
        // SAVE FUNCTIONALITY
        // ============================================

        document.getElementById('save-btn').addEventListener('click', () => {
            const json = JSON.stringify(phonemeMapping, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'alina_ipa_phoneme_mapping.json';
            a.click();
            URL.revokeObjectURL(url);

            console.log('[IPA Mapper] Saved mapping:', phonemeMapping);
            alert(`Mapping saved! ${Object.keys(phonemeMapping).length} phonemes configured.`);
        });

        // ============================================
        // ANIMATION LOOP
        // ============================================

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = (window.innerWidth - 450) / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth - 450, window.innerHeight);
        });

        // ============================================
        // INIT
        // ============================================

        initScene();
        loadModel();
        generatePhonemeUI();
        animate();
    </script>
</body>
</html>
