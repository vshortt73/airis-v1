<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris XTTS Lip Sync Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: #bb86fc; }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .display-section {
            display: flex;
            gap: 2rem;
            margin: 2rem 0;
            align-items: flex-start;
        }

        #mouthDisplay {
            width: 512px;
            height: 512px;
            border: 3px solid #bb86fc;
            border-radius: 1rem;
            position: relative;
            overflow: hidden;
            background: #2a2a2a;
            flex-shrink: 0;
        }

        #mouthCanvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        .controls-section {
            flex: 1;
            background: #2a2a2a;
            padding: 1.5rem;
            border-radius: 1rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #bb86fc;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 0.75rem;
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            border-radius: 0.5rem;
            color: #e0e0e0;
            font-size: 1rem;
            font-family: Arial, sans-serif;
            resize: vertical;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        button {
            flex: 1;
            padding: 1rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .generate-btn {
            background: #03dac6;
            color: #000;
        }

        .generate-btn:hover { background: #66fff9; }
        .generate-btn:disabled {
            background: #555;
            color: #999;
            cursor: not-allowed;
        }

        .stop-btn {
            background: #cf6679;
            color: #000;
        }

        .stop-btn:hover { background: #ff8a9b; }

        .test-btn {
            background: #bb86fc;
            color: #000;
        }

        .test-btn:hover { background: #d4b3ff; }

        .status {
            padding: 1rem;
            background: #1a1a1a;
            border-radius: 0.5rem;
            margin: 1rem 0;
            font-size: 0.9rem;
        }

        .status.info { border-left: 4px solid #03dac6; }
        .status.error { border-left: 4px solid #cf6679; }
        .status.success { border-left: 4px solid #4caf50; }

        .current-phoneme {
            text-align: center;
            font-size: 1.5rem;
            color: #03dac6;
            margin: 1rem 0;
            min-height: 2rem;
        }

        .phoneme-timeline {
            background: #1a1a1a;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
            max-height: 200px;
            overflow-y: auto;
        }

        .phoneme-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem;
            margin: 0.25rem 0;
            background: #2a2a2a;
            border-radius: 0.25rem;
            font-family: monospace;
        }

        .phoneme-item.active {
            background: #bb86fc;
            color: #000;
        }

        audio {
            width: 100%;
            margin-top: 1rem;
        }

        .settings {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .setting-item {
            display: flex;
            flex-direction: column;
        }

        .setting-item label {
            font-size: 0.85rem;
            margin-bottom: 0.25rem;
        }

        .setting-item input[type="range"] {
            width: 100%;
        }

        .setting-item input[type="number"] {
            padding: 0.5rem;
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            border-radius: 0.25rem;
            color: #e0e0e0;
        }

        .value-display {
            display: inline-block;
            color: #03dac6;
            font-weight: bold;
            margin-left: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭 Iris XTTS Lip Sync Test Harness</h1>

        <div class="current-phoneme" id="currentPhoneme">Ready</div>

        <div class="display-section">
            <div>
                <div id="mouthDisplay">
                    <canvas id="mouthCanvas" width="512" height="512"></canvas>
                </div>
                <audio id="audioPlayer" controls style="width: 512px;"></audio>
            </div>

            <div class="controls-section">
                <div class="input-group">
                    <label>Text to Speak:</label>
                    <textarea id="textInput" placeholder="Enter text for Iris to speak...">Hello! This is a test of the lip sync system. The quick brown fox jumps over the lazy dog.</textarea>
                </div>

                <div class="settings">
                    <div class="setting-item">
                        <label>
                            Temperature: <span class="value-display" id="tempValue">0.4</span>
                        </label>
                        <input type="range" id="temperature" min="0" max="1" step="0.1" value="0.4">
                    </div>
                    <div class="setting-item">
                        <label>
                            Speed: <span class="value-display" id="speedValue">1.4</span>
                        </label>
                        <input type="range" id="speed" min="0.5" max="2.0" step="0.1" value="1.4">
                    </div>
                </div>

                <div class="button-group">
                    <button class="generate-btn" onclick="generateAndAnimate()" id="generateBtn">
                        🎤 Generate & Animate
                    </button>
                    <button class="stop-btn" onclick="stopAnimation()" id="stopBtn">
                        ⏹ Stop
                    </button>
                </div>

                <button class="test-btn" onclick="testPhonemeSequence()" style="width: 100%; margin-bottom: 1rem;">
                    🧪 Test Phoneme Sequence
                </button>

                <div id="status" class="status info">
                    Status: Ready to generate speech
                </div>

                <div class="phoneme-timeline" id="phonemeTimeline">
                    <strong>Phoneme Timeline:</strong>
                    <div id="phonemeList"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="iris_phoneme_mapping.js"></script>
    <script>
        // Canvas setup
        const canvas = document.getElementById('mouthCanvas');
        const ctx = canvas.getContext('2d');
        const spriteSheet = new Image();
        spriteSheet.src = 'iris_phoneme_grid.png';

        let currentAnimation = null;
        let audioContext = null;
        let currentPhonemes = [];

        // Update value displays
        document.getElementById('temperature').addEventListener('input', (e) => {
            document.getElementById('tempValue').textContent = e.target.value;
        });

        document.getElementById('speed').addEventListener('input', (e) => {
            document.getElementById('speedValue').textContent = e.target.value;
        });

        // Wait for sprite sheet to load
        spriteSheet.onload = () => {
            showViseme('rest');
            setStatus('Sprite sheet loaded. Ready!', 'success');
        };

        function showViseme(visemeName) {
            if (!visemeCoords[visemeName]) {
                console.error('Unknown viseme:', visemeName);
                return;
            }

            const coord = visemeCoords[visemeName];
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(
                spriteSheet,
                coord.x, coord.y, coord.w, coord.h,
                0, 0, canvas.width, canvas.height
            );

            document.getElementById('currentPhoneme').textContent = visemeName.toUpperCase();
        }

        function setStatus(message, type = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
        }

        async function generateAndAnimate() {
            const text = document.getElementById('textInput').value.trim();
            if (!text) {
                setStatus('Please enter some text first', 'error');
                return;
            }

            const generateBtn = document.getElementById('generateBtn');
            generateBtn.disabled = true;
            setStatus('Sending text to XTTS server...', 'info');

            try {
                // Get settings
                const temperature = parseFloat(document.getElementById('temperature').value);
                const speed = parseFloat(document.getElementById('speed').value);

                // Call XTTS server
                const response = await fetch('http://localhost:8700/speak_stream_mp3', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text,
                        temperature: temperature,
                        speed: speed
                    })
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                setStatus('Audio generated! Converting text to phonemes...', 'info');

                // Get audio blob
                const audioBlob = await response.blob();
                const audioUrl = URL.createObjectURL(audioBlob);

                // Load audio
                const audioPlayer = document.getElementById('audioPlayer');
                audioPlayer.src = audioUrl;

                // Convert text to phoneme sequence (simple approximation)
                const phonemeSequence = textToPhonemeSequence(text);
                currentPhonemes = phonemeSequence;

                // Display phoneme timeline
                displayPhonemeTimeline(phonemeSequence);

                setStatus('Ready! Press play on audio to start lip sync', 'success');

                // Set up audio playback animation
                audioPlayer.onplay = () => {
                    animatePhonemes(phonemeSequence, audioPlayer);
                };

                // Auto-play
                setTimeout(() => audioPlayer.play(), 500);

            } catch (error) {
                setStatus(`Error: ${error.message}`, 'error');
                console.error('Generation error:', error);
            } finally {
                generateBtn.disabled = false;
            }
        }

        function textToPhonemeSequence(text) {
            // Simple English text to phoneme approximation
            // This is a basic implementation - for production, use a proper phonemizer
            const words = text.toLowerCase().replace(/[^a-z0-9 ]/g, '').split(/\s+/);
            const sequence = [];

            // Simple letter-to-phoneme mapping with timing
            const letterPhonemes = {
                'a': 'AE', 'b': 'B', 'c': 'K', 'd': 'D', 'e': 'EH',
                'f': 'F', 'g': 'G', 'h': 'HH', 'i': 'IH', 'j': 'JH',
                'k': 'K', 'l': 'L', 'm': 'M', 'n': 'N', 'o': 'AO',
                'p': 'P', 'q': 'K', 'r': 'R', 's': 'S', 't': 'T',
                'u': 'UH', 'v': 'V', 'w': 'W', 'x': 'K', 'y': 'Y', 'z': 'Z'
            };

            // Common digraphs and patterns
            const patterns = {
                'th': 'TH', 'sh': 'SH', 'ch': 'CH', 'ng': 'NG',
                'ee': 'IY', 'oo': 'UW', 'ou': 'AW', 'ow': 'OW',
                'ay': 'EY', 'ai': 'EY', 'oy': 'OY'
            };

            let time = 0;
            const avgPhonemeMs = 100; // Average milliseconds per phoneme

            words.forEach(word => {
                let i = 0;
                while (i < word.length) {
                    let matched = false;

                    // Try two-letter patterns first
                    if (i < word.length - 1) {
                        const digraph = word.substr(i, 2);
                        if (patterns[digraph]) {
                            sequence.push({
                                phoneme: patterns[digraph],
                                start: time,
                                duration: avgPhonemeMs * 1.2
                            });
                            time += avgPhonemeMs * 1.2;
                            i += 2;
                            matched = true;
                        }
                    }

                    // Single letter
                    if (!matched) {
                        const char = word[i];
                        if (letterPhonemes[char]) {
                            sequence.push({
                                phoneme: letterPhonemes[char],
                                start: time,
                                duration: avgPhonemeMs
                            });
                            time += avgPhonemeMs;
                        }
                        i++;
                    }
                }

                // Add brief pause between words
                sequence.push({
                    phoneme: 'SIL',
                    start: time,
                    duration: 50
                });
                time += 50;
            });

            return sequence;
        }

        function displayPhonemeTimeline(sequence) {
            const listEl = document.getElementById('phonemeList');
            listEl.innerHTML = '';

            sequence.forEach((item, index) => {
                const viseme = phonemeToViseme[item.phoneme] || 'rest';
                const div = document.createElement('div');
                div.className = 'phoneme-item';
                div.id = `phoneme-${index}`;
                div.innerHTML = `
                    <span>${item.phoneme} → ${viseme}</span>
                    <span>${(item.start / 1000).toFixed(2)}s</span>
                `;
                listEl.appendChild(div);
            });
        }

        function animatePhonemes(sequence, audioPlayer) {
            if (currentAnimation) {
                cancelAnimationFrame(currentAnimation);
            }

            let lastPhonemeIndex = -1;

            function updateMouth() {
                const currentTime = audioPlayer.currentTime * 1000; // Convert to ms

                // Find current phoneme
                const phonemeIndex = sequence.findIndex((item, index) => {
                    const nextItem = sequence[index + 1];
                    const endTime = nextItem ? nextItem.start : item.start + item.duration;
                    return currentTime >= item.start && currentTime < endTime;
                });

                if (phonemeIndex !== -1 && phonemeIndex !== lastPhonemeIndex) {
                    const phoneme = sequence[phonemeIndex].phoneme;
                    const viseme = phonemeToViseme[phoneme] || 'rest';
                    showViseme(viseme);

                    // Highlight in timeline
                    document.querySelectorAll('.phoneme-item').forEach(el => {
                        el.classList.remove('active');
                    });
                    const itemEl = document.getElementById(`phoneme-${phonemeIndex}`);
                    if (itemEl) {
                        itemEl.classList.add('active');
                        itemEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }

                    lastPhonemeIndex = phonemeIndex;
                }

                if (!audioPlayer.paused && !audioPlayer.ended) {
                    currentAnimation = requestAnimationFrame(updateMouth);
                } else {
                    showViseme('rest');
                }
            }

            updateMouth();
        }

        function stopAnimation() {
            const audioPlayer = document.getElementById('audioPlayer');
            audioPlayer.pause();
            audioPlayer.currentTime = 0;

            if (currentAnimation) {
                cancelAnimationFrame(currentAnimation);
                currentAnimation = null;
            }

            showViseme('rest');
            document.querySelectorAll('.phoneme-item').forEach(el => {
                el.classList.remove('active');
            });
            setStatus('Animation stopped', 'info');
        }

        async function testPhonemeSequence() {
            // Test sequence showing all visemes
            const testSequence = [
                'rest', 'closed', 'wide_open', 'big_smile', 'slight_smile',
                'lip_teeth', 'tongue_teeth', 'teeth_close', 'rounded_fwd',
                'medium_open', 'rounded_back', 'small_open', 'back_tongue',
                'tongue_roof', 'round_o', 'rest'
            ];

            setStatus('Testing all visemes...', 'info');

            for (const viseme of testSequence) {
                showViseme(viseme);
                await sleep(400);
            }

            setStatus('Test complete!', 'success');
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
    </script>
</body>
</html>
