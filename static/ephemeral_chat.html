<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ephemeral Chat - Model Testing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f23;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #1a1a2e;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid #2a2a3e;
            width: 100%;
            max-width: 900px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: #16213e;
            color: #e0e0e0;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a3e;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .header-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .tools-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #e0e0e0;
            font-size: 14px;
        }

        .tools-toggle input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #4a9eff;
        }

        .clear-btn {
            padding: 8px 16px;
            border: 1px solid #3a3a4e;
            border-radius: 6px;
            background: #2a2a3e;
            color: #e0e0e0;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .clear-btn:hover {
            background: #3a3a4e;
            border-color: #4a4a5e;
        }

        .model-indicator {
            padding: 6px 12px;
            background: #2a4a2e;
            border: 1px solid #3a5a3e;
            border-radius: 6px;
            color: #8f8;
            font-size: 13px;
            font-family: 'Courier New', monospace;
        }

        .server-select {
            padding: 6px 10px;
            background: #2a2a3e;
            border: 1px solid #3a3a4e;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 13px;
            cursor: pointer;
        }

        .server-select:focus {
            outline: none;
            border-color: #4a9eff;
        }

        .server-select option {
            background: #2a2a3e;
            color: #e0e0e0;
        }

        .temp-control {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #e0e0e0;
            font-size: 13px;
        }

        .temp-slider {
            width: 80px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #3a3a4e;
            border-radius: 2px;
            cursor: pointer;
        }

        .temp-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            background: #4a9eff;
            border-radius: 50%;
            cursor: pointer;
        }

        .temp-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: #4a9eff;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .temp-value {
            min-width: 32px;
            text-align: center;
            font-family: 'Courier New', monospace;
            color: #4a9eff;
        }

        .system-prompt-container {
            padding: 15px 20px;
            background: #1a1a2e;
            border-bottom: 1px solid #2a2a3e;
        }

        .system-prompt-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .system-prompt-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #3a3a4e;
            border-radius: 6px;
            background: #2a2a3e;
            color: #e0e0e0;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            min-height: 60px;
        }

        .system-prompt-input:focus {
            outline: none;
            border-color: #ffa500;
        }

        .system-prompt-input::placeholder {
            color: #666;
            font-style: italic;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #0f0f1e;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: #4a9eff;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: #2a2a3e;
            color: #e0e0e0;
            border-bottom-left-radius: 4px;
            border: 1px solid #3a3a4e;
        }

        .message.system {
            justify-content: center;
        }

        .message.system .message-content {
            background: rgba(74, 158, 255, 0.1);
            color: #4a9eff;
            font-size: 13px;
            max-width: 90%;
            text-align: center;
            border: 1px solid rgba(74, 158, 255, 0.2);
        }

        .message.tool {
            justify-content: flex-start;
        }

        .message.tool .message-content {
            background: #2a2a1e;
            color: #ffd666;
            border-left: 4px solid #ffa500;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-width: 80%;
            border: 1px solid #3a3a2e;
        }

        .tool-name {
            font-weight: bold;
            color: #ffa500;
            margin-bottom: 5px;
        }

        .tool-result {
            background: rgba(0, 0, 0, 0.3);
            padding: 8px;
            border-radius: 4px;
            margin-top: 5px;
            overflow-x: auto;
            border: 1px solid rgba(255, 165, 0, 0.2);
        }

        .input-container {
            padding: 20px;
            background: #16213e;
            border-top: 1px solid #2a2a3e;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #3a3a4e;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 50px;
            max-height: none;
            background: #2a2a3e;
            color: #e0e0e0;
        }

        .message-input:focus {
            outline: none;
            border-color: #4a9eff;
        }

        .send-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: #4a9eff;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(74, 158, 255, 0.4);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .image-btn {
            padding: 12px;
            border: 1px solid #3a3a4e;
            border-radius: 8px;
            background: #2a2a3e;
            color: #e0e0e0;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-btn:hover {
            background: #3a3a4e;
            border-color: #4a9eff;
        }

        .image-btn.has-image {
            background: #2a4a2e;
            border-color: #4a8a4e;
            color: #8f8;
        }

        .image-preview-container {
            display: none;
            padding: 10px 20px 0 20px;
            background: #16213e;
        }

        .image-preview-container.visible {
            display: block;
        }

        .image-preview-wrapper {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .image-preview {
            position: relative;
            display: inline-block;
        }

        .image-preview img {
            max-height: 100px;
            max-width: 150px;
            border-radius: 8px;
            border: 2px solid #3a3a4e;
        }

        .image-preview .remove-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ff4a4a;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-preview .remove-btn:hover {
            background: #ff6a6a;
        }

        .message-image {
            max-width: 300px;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 8px;
            display: block;
        }

        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-indicator {
            font-size: 12px;
            color: #888;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.2;
            stroke: #4a9eff;
        }

        .empty-state h2 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #888;
        }

        .empty-state p {
            font-size: 14px;
            color: #666;
        }

        /* Scrollbar styling */
        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: #1a1a2e;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: #3a3a4e;
            border-radius: 3px;
        }

        .messages-container::-webkit-scrollbar-thumb:hover {
            background: #4a4a5e;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 Ephemeral Chat</h1>
            <div class="header-controls">
                <span class="status-indicator" id="status">Connecting...</span>
                <select class="server-select" id="serverSelect" onchange="onServerChange()">
                    <option value="main">Main (qwen3:32b)</option>
                    <option value="node2_small">Node2 Small (mistral:7b)</option>
                </select>
                <span class="model-indicator" id="modelIndicator">llama.cpp</span>
                <div class="temp-control" title="Temperature: 0 = deterministic, 2 = very creative">
                    <span>🌡️</span>
                    <input type="range" class="temp-slider" id="tempSlider"
                           min="0" max="2" step="0.1" value="0.7"
                           oninput="updateTempDisplay()">
                    <span class="temp-value" id="tempValue">0.7</span>
                </div>
                <label class="tools-toggle">
                    <input type="checkbox" id="toolsToggle">
                    <span>🔧 Enable Tools</span>
                </label>
                <button class="clear-btn" id="clearBtn" onclick="clearConversation()">Clear Chat</button>
            </div>
        </div>

        <div class="system-prompt-container">
            <div class="system-prompt-label">
                <span>⚙️ System Prompt</span>
                <span style="color: #666; font-size: 11px;">(persistent - injected at each turn)</span>
            </div>
            <textarea
                class="system-prompt-input"
                id="systemPromptInput"
                placeholder="Enter system instructions here... (e.g., 'You are a helpful assistant. Be concise and accurate.')"
                oninput="autoResizeTextarea(this)"
            ></textarea>
        </div>

        <div class="messages-container" id="messagesContainer">
            <div class="empty-state">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                </svg>
                <h2>No Memory, No Limits</h2>
                <p>Test prompts and compare model responses on the fly</p>
            </div>
        </div>

        <div class="image-preview-container" id="imagePreviewContainer">
            <div class="image-preview-wrapper" id="imagePreviewWrapper"></div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <input type="file" id="imageInput" accept="image/*" multiple style="display: none;" onchange="handleImageSelect(event)">
                <button class="image-btn" id="imageBtn" onclick="document.getElementById('imageInput').click()" title="Attach images">
                    📷
                </button>
                <textarea
                    class="message-input"
                    id="messageInput"
                    placeholder="Type your message..."
                    onkeydown="handleKeyPress(event)"
                    oninput="autoResizeTextarea(this)"
                ></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
                    Send
                </button>
            </div>
        </div>
    </div>

    <script>
        // All requests go through same-origin backend to avoid HTTPS mixed content issues
        // Backend proxies to: localhost:11434 (text) and node2:11435 (vision)
        let messages = [];
        let isStreaming = false;
        let pendingImages = []; // Store {file, base64, dataUrl} objects
        let selectedServer = 'main'; // Current server selection
        let availableServers = {}; // Server info from backend
        let temperature = 0.7; // Sampling temperature

        function updateTempDisplay() {
            const slider = document.getElementById('tempSlider');
            const display = document.getElementById('tempValue');
            temperature = parseFloat(slider.value);
            display.textContent = temperature.toFixed(1);
        }

        // Handle image file selection
        function handleImageSelect(event) {
            const files = event.target.files;
            if (!files.length) return;

            for (const file of files) {
                if (!file.type.startsWith('image/')) continue;

                const reader = new FileReader();
                reader.onload = (e) => {
                    const dataUrl = e.target.result;
                    // Extract base64 without the data URI prefix for API
                    const base64 = dataUrl.split(',')[1];

                    pendingImages.push({
                        file: file,
                        base64: base64,
                        dataUrl: dataUrl
                    });

                    updateImagePreviews();
                };
                reader.readAsDataURL(file);
            }

            // Clear input so same file can be selected again
            event.target.value = '';
        }

        // Update the image preview display
        function updateImagePreviews() {
            const container = document.getElementById('imagePreviewContainer');
            const wrapper = document.getElementById('imagePreviewWrapper');
            const imageBtn = document.getElementById('imageBtn');

            wrapper.innerHTML = '';

            if (pendingImages.length === 0) {
                container.classList.remove('visible');
                imageBtn.classList.remove('has-image');
                return;
            }

            container.classList.add('visible');
            imageBtn.classList.add('has-image');

            pendingImages.forEach((img, index) => {
                const preview = document.createElement('div');
                preview.className = 'image-preview';
                preview.innerHTML = `
                    <img src="${img.dataUrl}" alt="Preview">
                    <button class="remove-btn" onclick="removeImage(${index})" title="Remove">&times;</button>
                `;
                wrapper.appendChild(preview);
            });
        }

        // Remove a pending image
        function removeImage(index) {
            pendingImages.splice(index, 1);
            updateImagePreviews();
        }

        // Clear all pending images
        function clearPendingImages() {
            pendingImages = [];
            updateImagePreviews();
        }

        // Check server health and load available servers
        async function checkServerHealth() {
            try {
                // Get available servers
                const serversResponse = await fetch('/api/ephemeral/servers');
                const serversData = await serversResponse.json();

                if (serversData.success && serversData.servers) {
                    const serverSelect = document.getElementById('serverSelect');
                    serverSelect.innerHTML = '';

                    for (const server of serversData.servers) {
                        availableServers[server.id] = server;

                        const option = document.createElement('option');
                        option.value = server.id;
                        option.textContent = server.ok
                            ? `${server.name} ✓`
                            : `${server.name} ✗`;
                        option.disabled = !server.ok;
                        serverSelect.appendChild(option);
                    }

                    // Select first available server
                    const firstAvailable = serversData.servers.find(s => s.ok);
                    if (firstAvailable) {
                        serverSelect.value = firstAvailable.id;
                        selectedServer = firstAvailable.id;
                        updateModelIndicator(firstAvailable);
                    }
                }

                // Also check vision health
                const healthResponse = await fetch('/api/ephemeral/health');
                const healthData = await healthResponse.json();

                const currentServer = availableServers[selectedServer];
                if (currentServer?.ok) {
                    document.getElementById('sendBtn').disabled = false;
                    document.getElementById('messageInput').disabled = false;
                    updateStatus('Ready');

                    let msg = `✓ Connected to ${currentServer.name}`;
                    if (healthData.vision?.ok) {
                        msg += ' and vision model (images)';
                    } else {
                        msg += '. ⚠️ Vision server unavailable - image analysis disabled';
                    }
                    addSystemMessage(msg);
                } else {
                    updateStatus('Disconnected');
                    addSystemMessage('⚠️ No inference servers available');
                }
            } catch (error) {
                console.error('Failed to check server health:', error);
                updateStatus('Error');
                addSystemMessage('⚠️ Could not connect to backend');
            }
        }

        function updateModelIndicator(server) {
            const modelIndicator = document.getElementById('modelIndicator');
            modelIndicator.textContent = server?.model || server?.name || 'Unknown';
            modelIndicator.style.background = server?.ok ? '#2a4a2e' : '#4a2a2e';
            modelIndicator.style.borderColor = server?.ok ? '#3a5a3e' : '#5a3a3e';
            modelIndicator.style.color = server?.ok ? '#8f8' : '#f88';
        }

        function onServerChange() {
            const serverSelect = document.getElementById('serverSelect');
            selectedServer = serverSelect.value;
            const server = availableServers[selectedServer];
            updateModelIndicator(server);

            // Disable tools for non-main servers
            const toolsToggle = document.getElementById('toolsToggle');
            if (selectedServer !== 'main') {
                toolsToggle.checked = false;
                toolsToggle.disabled = true;
                toolsToggle.parentElement.style.opacity = '0.5';
                toolsToggle.parentElement.title = 'Tools only available on main server';
            } else {
                toolsToggle.disabled = false;
                toolsToggle.parentElement.style.opacity = '1';
                toolsToggle.parentElement.title = '';
            }

            addSystemMessage(`Switched to ${server?.name || selectedServer}`);
        }

        function updateStatus(text) {
            document.getElementById('status').textContent = text;
        }

        function addSystemMessage(text) {
            const container = document.getElementById('messagesContainer');
            const emptyState = container.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = 'message system';
            messageDiv.innerHTML = `<div class="message-content">${text}</div>`;
            container.appendChild(messageDiv);
            scrollToBottom();
        }

        function addMessage(role, content, images = []) {
            const container = document.getElementById('messagesContainer');
            const emptyState = container.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            let html = `<div class="message-content">${escapeHtml(content)}`;

            // Add images if present
            if (images && images.length > 0) {
                for (const img of images) {
                    html += `<img class="message-image" src="${img.dataUrl || img}" alt="Attached image">`;
                }
            }

            html += '</div>';
            messageDiv.innerHTML = html;
            container.appendChild(messageDiv);
            scrollToBottom();

            return messageDiv;
        }

        function updateLastMessage(content) {
            const container = document.getElementById('messagesContainer');
            const messages = container.querySelectorAll('.message.assistant');
            if (messages.length > 0) {
                const lastMessage = messages[messages.length - 1];
                const contentDiv = lastMessage.querySelector('.message-content');
                contentDiv.textContent = content;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function scrollToBottom() {
            const container = document.getElementById('messagesContainer');
            container.scrollTop = container.scrollHeight;
        }

        // Send message with images to vision endpoint via backend
        async function sendVisionMessage(userMessage, images, systemPrompt) {
            console.log('[Vision] Sending to backend vision endpoint with', images.length, 'image(s)');

            // Build messages for vision API
            const visionMessages = [];

            if (systemPrompt) {
                visionMessages.push({ role: 'system', content: systemPrompt });
            }

            // Add previous conversation context (text only)
            for (const msg of messages.slice(0, -1)) { // Exclude the just-added user message
                if (msg.content && typeof msg.content === 'string') {
                    visionMessages.push({ role: msg.role, content: msg.content });
                }
            }

            // Add current user message
            visionMessages.push({
                role: 'user',
                content: userMessage || 'What do you see in this image?'
            });

            // Build request for backend vision endpoint
            const requestBody = {
                messages: visionMessages,
                images: images.map(img => img.base64)  // Base64 without data URI prefix
            };

            try {
                const response = await fetch('/api/ephemeral/vision', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.detail || `Vision API error: ${response.status}`);
                }

                const data = await response.json();
                const content = data.content || 'No response from vision model';
                console.log('[Vision] Response received:', content.substring(0, 100) + '...');
                return content;

            } catch (error) {
                console.error('[Vision] Error:', error);
                throw error;
            }
        }

        async function sendMessage() {
            if (isStreaming) return;

            const input = document.getElementById('messageInput');
            const userMessage = input.value.trim();

            if (!userMessage && pendingImages.length === 0) return;

            const toolsEnabled = document.getElementById('toolsToggle').checked;
            const systemPrompt = document.getElementById('systemPromptInput').value.trim();

            // Capture images before clearing
            const imagesToSend = [...pendingImages];
            const hasImages = imagesToSend.length > 0;

            // Store user message content for history (text only)
            messages.push({ role: 'user', content: userMessage || '[Image attached]' });
            addMessage('user', userMessage || '[Image]', imagesToSend);

            // Clear inputs
            input.value = '';
            autoResizeTextarea(input);
            clearPendingImages();

            // Disable input
            isStreaming = true;
            document.getElementById('sendBtn').innerHTML = '<div class="loading"></div>';
            document.getElementById('sendBtn').disabled = true;
            input.disabled = true;

            try {
                let assistantContent = '';
                let currentAssistantDiv = null;
                let pendingToolCalls = [];

                // Route based on whether images are present
                if (hasImages) {
                    // VISION PATH: Use Ollama vision endpoint
                    assistantContent = await sendVisionMessage(userMessage, imagesToSend, systemPrompt);
                    addMessage('assistant', assistantContent);
                    messages.push({ role: 'assistant', content: assistantContent });
                } else {
                    // TEXT PATH: Use backend chat endpoint (proxies to llama.cpp)

                    // Build messages array with system prompt if provided
                    let messagesToSend = [...messages];
                    if (systemPrompt) {
                        messagesToSend = [
                            { role: 'system', content: systemPrompt },
                            ...messages
                        ];
                    }

                    // Build request body for backend chat API
                    const requestBody = {
                        messages: messagesToSend,
                        stream: true,
                        tools_enabled: toolsEnabled,
                        server: selectedServer,
                        temperature: temperature
                    };

                    // Stream response via backend (proxies to llama.cpp)
                    const response = await fetch('/api/ephemeral/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(requestBody)
                    });

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop(); // Keep incomplete line in buffer

                        for (const line of lines) {
                            const trimmed = line.trim();
                            if (!trimmed || !trimmed.startsWith('data: ')) continue;

                            const jsonStr = trimmed.substring(6);
                            if (jsonStr === '[DONE]') continue;

                            try {
                                const data = JSON.parse(jsonStr);
                                const choice = data.choices?.[0];
                                if (!choice) continue;

                                const delta = choice.delta;

                                // Handle tool calls in delta
                                if (delta?.tool_calls) {
                                    for (const toolCall of delta.tool_calls) {
                                        const idx = toolCall.index || 0;
                                        if (!pendingToolCalls[idx]) {
                                            pendingToolCalls[idx] = {
                                                id: toolCall.id || `call_${idx}`,
                                                function: { name: '', arguments: '' }
                                            };
                                        }
                                        if (toolCall.function?.name) {
                                            pendingToolCalls[idx].function.name += toolCall.function.name;
                                        }
                                        if (toolCall.function?.arguments) {
                                            pendingToolCalls[idx].function.arguments += toolCall.function.arguments;
                                        }
                                    }
                                }

                                // Handle content streaming
                                if (delta?.content) {
                                    if (!currentAssistantDiv) {
                                        currentAssistantDiv = addMessage('assistant', '');
                                    }
                                    assistantContent += delta.content;
                                    updateLastMessage(assistantContent);
                                }

                                // Handle finish reason
                                if (choice.finish_reason === 'tool_calls' && pendingToolCalls.length > 0) {
                                    // Execute tool calls
                                    for (const toolCall of pendingToolCalls) {
                                        if (toolCall.function.name) {
                                            addToolMessage(toolCall.function.name, 'Executing...', null);

                                            // Execute via backend
                                            try {
                                                const toolResult = await fetch('/api/ephemeral/execute_tool', {
                                                    method: 'POST',
                                                    headers: { 'Content-Type': 'application/json' },
                                                    body: JSON.stringify({
                                                        name: toolCall.function.name,
                                                        arguments: JSON.parse(toolCall.function.arguments || '{}')
                                                    })
                                                });
                                                const result = await toolResult.json();
                                                updateLastToolMessage(toolCall.function.name, result);

                                                // Add tool result to messages for context
                                                messages.push({
                                                    role: 'assistant',
                                                    content: null,
                                                    tool_calls: [{
                                                        id: toolCall.id,
                                                        type: 'function',
                                                        function: toolCall.function
                                                    }]
                                                });
                                                messages.push({
                                                    role: 'tool',
                                                    tool_call_id: toolCall.id,
                                                    content: JSON.stringify(result)
                                                });
                                            } catch (e) {
                                                updateLastToolMessage(toolCall.function.name, { error: e.message });
                                            }
                                        }
                                    }
                                }

                            } catch (e) {
                                console.error('Failed to parse SSE data:', e, jsonStr);
                            }
                        }
                    }

                    // Save assistant response
                    if (assistantContent) {
                        messages.push({ role: 'assistant', content: assistantContent });
                    }
                } // End of else (text path)

            } catch (error) {
                console.error('Error sending message:', error);
                addSystemMessage('⚠️ Error: ' + error.message);
            } finally {
                // Re-enable input
                isStreaming = false;
                document.getElementById('sendBtn').innerHTML = 'Send';
                document.getElementById('sendBtn').disabled = false;
                input.disabled = false;
                input.focus();
            }
        }

        function addToolMessage(toolName, status, result) {
            const container = document.getElementById('messagesContainer');
            const emptyState = container.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = 'message tool';
            messageDiv.setAttribute('data-tool-name', toolName);

            let content = `<div class="tool-name">🔧 ${toolName}</div>`;
            content += `<div class="tool-status">${status}</div>`;

            if (result) {
                content += `<div class="tool-result">${JSON.stringify(result, null, 2)}</div>`;
            }

            messageDiv.innerHTML = `<div class="message-content">${content}</div>`;
            container.appendChild(messageDiv);
            scrollToBottom();

            return messageDiv;
        }

        function updateLastToolMessage(toolName, result) {
            const container = document.getElementById('messagesContainer');
            const toolMessages = container.querySelectorAll(`.message.tool[data-tool-name="${toolName}"]`);

            if (toolMessages.length > 0) {
                const lastToolMessage = toolMessages[toolMessages.length - 1];
                const contentDiv = lastToolMessage.querySelector('.message-content');

                let content = `<div class="tool-name">🔧 ${toolName}</div>`;
                content += `<div class="tool-status">✓ Completed</div>`;
                content += `<div class="tool-result">${JSON.stringify(result, null, 2)}</div>`;

                contentDiv.innerHTML = content;
                scrollToBottom();
            }
        }

        function clearConversation() {
            messages = [];
            clearPendingImages();
            const container = document.getElementById('messagesContainer');
            container.innerHTML = `
                <div class="empty-state">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                    </svg>
                    <h2>No Memory, No Limits</h2>
                    <p>Test prompts and compare model responses on the fly</p>
                </div>
            `;
        }

        function autoResizeTextarea(textarea) {
            // Reset height to get accurate scrollHeight
            textarea.style.height = 'auto';
            // Set height to scrollHeight to fit content
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // Drag and drop support for images
        function setupDragAndDrop() {
            const container = document.querySelector('.container');

            container.addEventListener('dragover', (e) => {
                e.preventDefault();
                container.style.outline = '2px dashed #4a9eff';
            });

            container.addEventListener('dragleave', (e) => {
                e.preventDefault();
                container.style.outline = 'none';
            });

            container.addEventListener('drop', (e) => {
                e.preventDefault();
                container.style.outline = 'none';

                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    // Create a fake event to reuse handleImageSelect
                    handleImageSelect({ target: { files: files, value: '' } });
                }
            });
        }

        // Paste image support
        function setupPasteSupport() {
            document.addEventListener('paste', (e) => {
                const items = e.clipboardData?.items;
                if (!items) return;

                for (const item of items) {
                    if (item.type.startsWith('image/')) {
                        const file = item.getAsFile();
                        if (file) {
                            const reader = new FileReader();
                            reader.onload = (ev) => {
                                const dataUrl = ev.target.result;
                                const base64 = dataUrl.split(',')[1];
                                pendingImages.push({
                                    file: file,
                                    base64: base64,
                                    dataUrl: dataUrl
                                });
                                updateImagePreviews();
                            };
                            reader.readAsDataURL(file);
                        }
                    }
                }
            });
        }

        // Initialize on load
        window.addEventListener('load', () => {
            checkServerHealth();
            setupDragAndDrop();
            setupPasteSupport();
        });
    </script>
</body>
</html>
