<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lip Sync Test - Upload Audio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            overflow: hidden;
        }
        #container {
            display: flex;
            height: 100vh;
        }
        #canvas-container {
            flex: 1;
        }
        #controls-panel {
            width: 400px;
            background: #2a2a2a;
            border-left: 1px solid #444;
            display: flex;
            flex-direction: column;
        }
        .panel-header {
            padding: 20px;
            background: #333;
            border-bottom: 1px solid #444;
        }
        .panel-header h1 {
            font-size: 1.4rem;
            color: #bb86fc;
            margin-bottom: 5px;
        }
        .panel-header .subtitle {
            font-size: 0.9rem;
            color: #888;
        }
        .panel-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .input-group input[type="file"] {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 5px;
            color: #e0e0e0;
            font-size: 1rem;
        }
        .input-group textarea {
            width: 100%;
            min-height: 80px;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 5px;
            color: #e0e0e0;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
        }
        .process-btn {
            width: 100%;
            padding: 12px;
            background: #bb86fc;
            color: #000;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .process-btn:hover {
            background: #d4b3ff;
        }
        .process-btn:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
        }
        .status {
            margin-top: 15px;
            padding: 12px;
            background: #333;
            border-radius: 5px;
            font-size: 0.85rem;
            border-left: 3px solid #03dac6;
        }
        .status.error {
            border-color: #ff4444;
            color: #ff4444;
        }
        .phoneme-list {
            margin-top: 20px;
            padding: 12px;
            background: #333;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 0.75rem;
            font-family: monospace;
        }
        .phoneme-item {
            padding: 4px;
            margin: 2px 0;
            background: #1a1a1a;
            border-radius: 3px;
        }
        .phoneme-item.active {
            background: #bb86fc;
            color: #000;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-container"></div>

        <div id="controls-panel">
            <div class="panel-header">
                <h1>Lip Sync Upload Test</h1>
                <div class="subtitle">Test with human voice audio</div>
            </div>

            <div class="panel-body">
                <div class="input-group">
                    <label>Upload Audio (WAV or MP3):</label>
                    <input type="file" id="audio-file" accept="audio/*">
                </div>

                <div class="input-group">
                    <label>What does the audio say?</label>
                    <textarea id="transcript-input" placeholder="Type the exact words spoken in the audio..."></textarea>
                </div>

                <button id="process-btn" class="process-btn">Analyze & Animate</button>

                <div id="status" class="status" style="display: none;"></div>

                <div id="phoneme-list" class="phoneme-list" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { KHR_materials_pbrSpecularGlossiness } from 'three/addons/loaders/KHR_materials_pbrSpecularGlossiness.js';

        let scene, camera, renderer, controls;
        let avatarModel = null;
        let blendShapeMeshes = [];
        let jawBone = null;
        let jawInitialRotation = null;

        let phonemeMapping = null;
        let currentAudio = null;
        let animationFrame = null;

        // ============================================
        // SCENE SETUP
        // ============================================

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x2a2a2a);

            camera = new THREE.PerspectiveCamera(50, (window.innerWidth - 400) / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0.9, 1.2);
            camera.lookAt(0, 0.9, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth - 400, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 0.9, 0);
            controls.enableDamping = true;
            controls.update();

            // Bright lighting
            scene.add(new THREE.AmbientLight(0xffffff, 1.5));
            scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.0));

            const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
            keyLight.position.set(1, 1, 2);
            scene.add(keyLight);

            const faceLight = new THREE.PointLight(0xffffff, 1.0, 5);
            faceLight.position.set(0, 1.0, 1.5);
            scene.add(faceLight);
        }

        // ============================================
        // MODEL LOADING
        // ============================================

        function loadModel() {
            const loader = new GLTFLoader();
            // Register extension for older GLTF material format
            loader.register((parser) => new KHR_materials_pbrSpecularGlossiness(parser));

            loader.load('/assets/3D/alina/scene.gltf',
                (gltf) => {
                    avatarModel = gltf.scene;
                    scene.add(avatarModel);

                    avatarModel.traverse((node) => {
                        if (node.isBone && node.name === 'CC_Base_JawRoot_040') {
                            jawBone = node;
                            jawInitialRotation = jawBone.rotation.z;
                        }

                        if (node.isMesh && node.morphTargetInfluences && node.morphTargetInfluences.length > 0) {
                            blendShapeMeshes.push(node);
                        }

                        // Fix texture color spaces
                        if (node.isMesh && node.material) {
                            const material = node.material;

                            // Set diffuse/base color textures to sRGB
                            if (material.map) {
                                material.map.colorSpace = THREE.SRGBColorSpace;
                                material.map.needsUpdate = true;
                            }

                            // Ensure normal maps stay in Linear space
                            if (material.normalMap) {
                                material.normalMap.colorSpace = THREE.LinearSRGBColorSpace;
                                material.normalMap.needsUpdate = true;
                            }

                            // Set other texture maps to Linear
                            if (material.roughnessMap) {
                                material.roughnessMap.colorSpace = THREE.LinearSRGBColorSpace;
                                material.roughnessMap.needsUpdate = true;
                            }
                            if (material.metalnessMap) {
                                material.metalnessMap.colorSpace = THREE.LinearSRGBColorSpace;
                                material.metalnessMap.needsUpdate = true;
                            }
                            if (material.emissiveMap) {
                                material.emissiveMap.colorSpace = THREE.SRGBColorSpace;
                                material.emissiveMap.needsUpdate = true;
                            }

                            material.needsUpdate = true;

                            node.castShadow = true;
                            node.receiveShadow = true;
                        }
                    });
                }
            );
        }

        // Load phoneme mapping
        async function loadPhonemeMapping() {
            const response = await fetch('/assets/3D/alina/alina_hybrid_phoneme_mapping.json');
            phonemeMapping = await response.json();
        }

        // ============================================
        // ANIMATION FUNCTIONS
        // ============================================

        function setJawRotation(percent) {
            if (!jawBone || jawInitialRotation === null) return;
            const maxRotation = 0.5;
            const delta = (percent / 100) * maxRotation;
            jawBone.rotation.z = jawInitialRotation + delta;
        }

        function setBlendShapes(indices, value = 1.0) {
            blendShapeMeshes.forEach(mesh => {
                for (let i = 0; i < mesh.morphTargetInfluences.length; i++) {
                    mesh.morphTargetInfluences[i] = 0;
                }
            });

            indices.forEach(index => {
                blendShapeMeshes.forEach(mesh => {
                    if (index < mesh.morphTargetInfluences.length) {
                        mesh.morphTargetInfluences[index] = value;
                    }
                });
            });
        }

        function applyPhoneme(phonemeId) {
            if (!phonemeMapping || !phonemeMapping[phonemeId]) return;
            const config = phonemeMapping[phonemeId];
            setJawRotation(config.jaw);
            setBlendShapes(config.blendShapes);
        }

        function resetMouth() {
            setJawRotation(0);
            setBlendShapes([]);
        }

        // ============================================
        // PROCESS UPLOADED AUDIO
        // ============================================

        async function processUploadedAudio(audioFile, transcript) {
            const statusEl = document.getElementById('status');
            const processBtn = document.getElementById('process-btn');
            const phonemeListEl = document.getElementById('phoneme-list');

            statusEl.style.display = 'block';
            statusEl.className = 'status';
            statusEl.textContent = 'Processing audio with Rhubarb...';
            processBtn.disabled = true;

            try {
                // Create FormData with audio and transcript
                const formData = new FormData();
                formData.append('audio', audioFile);
                formData.append('text', transcript);

                // Send to backend for Rhubarb processing
                const response = await fetch('/api/tts/analyze_uploaded_audio', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error || 'Unknown error');
                }

                console.log('[Upload] Received phonemes:', data.phonemes);

                statusEl.textContent = `Analyzed! Found ${data.phonemes.length} phonemes. Playing...`;

                // Display phonemes
                phonemeListEl.style.display = 'block';
                phonemeListEl.innerHTML = data.phonemes.map((p, i) =>
                    `<div class="phoneme-item" id="phoneme-${i}">${p.start.toFixed(2)}s - ${p.end.toFixed(2)}s: ${p.value}</div>`
                ).join('');

                // Play audio with animation
                const audioBlob = new Blob([audioFile], { type: audioFile.type });
                const audioUrl = URL.createObjectURL(audioBlob);
                await playWithAnimation(audioUrl, data.phonemes);

                statusEl.textContent = 'Done!';
                processBtn.disabled = false;

            } catch (error) {
                console.error('[Upload] Error:', error);
                statusEl.className = 'status error';
                statusEl.textContent = `Error: ${error.message}`;
                processBtn.disabled = false;
            }
        }

        async function playWithAnimation(audioUrl, phonemes) {
            return new Promise((resolve, reject) => {
                currentAudio = new Audio(audioUrl);
                currentAudio.play();

                const startTime = performance.now();
                let currentPhonemeIndex = -1;

                function animate() {
                    const elapsed = (performance.now() - startTime) / 1000;

                    const phoneme = phonemes.find(p => elapsed >= p.start && elapsed <= p.end);

                    if (phoneme) {
                        const phonemeIndex = phonemes.indexOf(phoneme);
                        if (phonemeIndex !== currentPhonemeIndex) {
                            applyPhoneme(phoneme.value);
                            currentPhonemeIndex = phonemeIndex;

                            document.querySelectorAll('.phoneme-item').forEach(el => el.classList.remove('active'));
                            document.getElementById(`phoneme-${phonemeIndex}`)?.classList.add('active');
                        }
                    } else {
                        if (currentPhonemeIndex !== -1) {
                            resetMouth();
                            currentPhonemeIndex = -1;
                            document.querySelectorAll('.phoneme-item').forEach(el => el.classList.remove('active'));
                        }
                    }

                    if (elapsed < (phonemes[phonemes.length - 1]?.end || 0) + 0.5) {
                        animationFrame = requestAnimationFrame(animate);
                    } else {
                        resetMouth();
                        resolve();
                    }
                }

                currentAudio.onended = () => {
                    if (animationFrame) cancelAnimationFrame(animationFrame);
                    resetMouth();
                    resolve();
                };

                currentAudio.onerror = (error) => {
                    if (animationFrame) cancelAnimationFrame(animationFrame);
                    resetMouth();
                    reject(error);
                };

                animate();
            });
        }

        // ============================================
        // ANIMATION LOOP
        // ============================================

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = (window.innerWidth - 400) / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth - 400, window.innerHeight);
        });

        // ============================================
        // EVENT HANDLERS
        // ============================================

        document.getElementById('process-btn').addEventListener('click', () => {
            const audioFile = document.getElementById('audio-file').files[0];
            const transcript = document.getElementById('transcript-input').value.trim();

            if (!audioFile) {
                alert('Please select an audio file');
                return;
            }

            if (!transcript) {
                alert('Please enter the transcript (what the audio says)');
                return;
            }

            processUploadedAudio(audioFile, transcript);
        });

        // ============================================
        // INIT
        // ============================================

        initScene();
        loadModel();
        loadPhonemeMapping();
        animate();
    </script>
</body>
</html>
