<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blend Shape Explorer - Alina</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            overflow: hidden;
        }
        #container {
            display: flex;
            height: 100vh;
        }
        #canvas-container {
            flex: 1;
            position: relative;
        }
        #controls-panel {
            width: 400px;
            background: #2a2a2a;
            border-left: 1px solid #444;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .panel-header {
            padding: 15px;
            background: #333;
            border-bottom: 1px solid #444;
        }
        .panel-header h1 {
            font-size: 1.3rem;
            color: #bb86fc;
            margin-bottom: 5px;
        }
        .panel-header .subtitle {
            font-size: 0.85rem;
            color: #888;
        }
        .search-box {
            padding: 10px 15px;
            background: #2a2a2a;
            border-bottom: 1px solid #444;
        }
        .search-box input {
            width: 100%;
            padding: 8px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 5px;
            color: #e0e0e0;
            font-size: 0.9rem;
        }
        .search-box input:focus {
            outline: none;
            border-color: #bb86fc;
        }
        .controls-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        .blend-shape-control {
            margin-bottom: 20px;
            padding: 12px;
            background: #333;
            border-radius: 8px;
            border: 2px solid transparent;
        }
        .blend-shape-control.marked {
            border-color: #03dac6;
            background: #2a3a3a;
        }
        .blend-shape-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .blend-shape-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: #e0e0e0;
        }
        .blend-shape-name .index {
            color: #666;
            font-weight: normal;
            margin-right: 5px;
        }
        .blend-shape-value {
            font-size: 0.9rem;
            color: #03dac6;
            font-weight: bold;
            min-width: 40px;
            text-align: right;
        }
        .blend-shape-slider {
            width: 100%;
            margin-bottom: 8px;
        }
        .blend-shape-actions {
            display: flex;
            gap: 5px;
        }
        .blend-shape-actions button {
            flex: 1;
            padding: 5px;
            background: #444;
            border: 1px solid #555;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .blend-shape-actions button:hover {
            background: #555;
        }
        .blend-shape-actions button.mark-btn.marked {
            background: #03dac6;
            color: #000;
            border-color: #03dac6;
        }
        .blend-shape-actions button.hide-btn {
            flex: 0 0 30px;
            padding: 5px;
            background: #3a3a3a;
            color: #888;
        }
        .blend-shape-actions button.hide-btn:hover {
            background: #ff4444;
            color: #fff;
        }
        .blend-shape-control.hidden {
            display: none;
        }
        .panel-footer {
            padding: 15px;
            background: #333;
            border-top: 1px solid #444;
        }
        .panel-footer button {
            width: 100%;
            padding: 10px;
            background: #bb86fc;
            color: #000;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
        }
        .panel-footer button:hover {
            background: #d4b3ff;
        }
        .stats {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #444;
            font-size: 0.85rem;
            color: #888;
        }
        .stats div {
            margin-bottom: 5px;
        }
        .stats .highlight {
            color: #03dac6;
            font-weight: bold;
        }
        /* Scrollbar styling */
        .controls-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .controls-scroll::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        .controls-scroll::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }
        .controls-scroll::-webkit-scrollbar-thumb:hover {
            background: #666;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-container"></div>

        <div id="controls-panel">
            <div class="panel-header">
                <h1>Blend Shape Explorer</h1>
                <div class="subtitle">Alina Character - Find Mouth Shapes</div>
            </div>

            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search blend shapes...">
            </div>

            <div class="controls-scroll" id="controls-container">
                <!-- Blend shape controls will be generated here -->
            </div>

            <div class="panel-footer">
                <button id="reset-all-btn">Reset All to Zero</button>
                <button id="show-all-btn">Show All Hidden</button>
                <button id="export-marked-btn">Export Marked Shapes</button>
                <div class="stats">
                    <div>Total Shapes: <span class="highlight" id="total-shapes">0</span></div>
                    <div>Marked: <span class="highlight" id="marked-count">0</span></div>
                    <div>Hidden: <span class="highlight" id="hidden-count">0</span></div>
                    <div>FPS: <span class="highlight" id="fps">0</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Three.js from CDN -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ============================================
        // GLOBALS
        // ============================================

        let scene, camera, renderer, controls;
        let avatarModel = null;
        let blendShapeMeshes = [];  // Meshes with morph targets
        let markedShapes = new Set();  // Set of marked blend shape indices
        let clock = new THREE.Clock();

        // FPS tracking
        let frameCount = 0;
        let lastTime = performance.now();

        // ============================================
        // SCENE SETUP
        // ============================================

        function initScene() {
            console.log('[Explorer] Initializing scene...');

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x2a2a2a);

            // Camera - focus on head
            camera = new THREE.PerspectiveCamera(
                50,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 0.9, 1.2);
            camera.lookAt(0, 0.9, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth - 400, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.outputColorSpace = THREE.SRGBColorSpace;

            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0, 0.9, 0);
            controls.update();

            // Lighting - bright for detail inspection
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
            scene.add(ambientLight);

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.0);
            hemiLight.position.set(0, 20, 0);
            scene.add(hemiLight);

            const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
            keyLight.position.set(1, 1, 2);
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0xffffff, 1.0);
            fillLight.position.set(-2, 0.5, 1);
            scene.add(fillLight);

            const faceLight = new THREE.PointLight(0xffffff, 1.0, 5);
            faceLight.position.set(0, 1.0, 1.5);
            scene.add(faceLight);

            console.log('[Explorer] ✓ Scene initialized');
        }

        // ============================================
        // MODEL LOADING
        // ============================================

        function loadModel() {
            console.log('[Explorer] Loading Alina model...');

            const loader = new GLTFLoader();
            loader.load(
                '/assets/3D/alina/scene.gltf',
                (gltf) => {
                    console.log('[Explorer] ✓ Model loaded');
                    avatarModel = gltf.scene;

                    // Enable shadows and configure materials
                    avatarModel.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = true;
                            node.receiveShadow = true;

                            // Fix materials and textures
                            if (node.material) {
                                // Handle both single material and material arrays
                                const materials = Array.isArray(node.material) ? node.material : [node.material];
                                materials.forEach(mat => {
                                    // Ensure proper color space for textures
                                    if (mat.map) {
                                        mat.map.colorSpace = THREE.SRGBColorSpace;
                                    }
                                    if (mat.emissiveMap) {
                                        mat.emissiveMap.colorSpace = THREE.SRGBColorSpace;
                                    }
                                    // Force material update
                                    mat.needsUpdate = true;
                                });
                            }

                            // Check for morph targets
                            if (node.morphTargetInfluences && node.morphTargetInfluences.length > 0) {
                                console.log(`[Explorer] Found mesh with ${node.morphTargetInfluences.length} blend shapes:`, node.name);
                                blendShapeMeshes.push(node);
                            }
                        }
                    });

                    scene.add(avatarModel);

                    // Build blend shape UI
                    buildBlendShapeControls();

                    console.log('[Explorer] ✓ Ready - found', blendShapeMeshes.length, 'meshes with blend shapes');
                },
                (progress) => {
                    const percent = (progress.loaded / progress.total * 100).toFixed(0);
                    console.log(`[Explorer] Loading: ${percent}%`);
                },
                (error) => {
                    console.error('[Explorer] ✗ Error loading model:', error);
                }
            );
        }

        // ============================================
        // BLEND SHAPE UI
        // ============================================

        function buildBlendShapeControls() {
            const container = document.getElementById('controls-container');
            container.innerHTML = '';

            if (blendShapeMeshes.length === 0) {
                container.innerHTML = '<div style="padding: 20px; text-align: center; color: #888;">No blend shapes found</div>';
                return;
            }

            // Use the mesh with the most blend shapes (likely the face)
            const mainMesh = blendShapeMeshes.reduce((max, mesh) =>
                mesh.morphTargetInfluences.length > max.morphTargetInfluences.length ? mesh : max
            );

            const numShapes = mainMesh.morphTargetInfluences.length;
            console.log(`[Explorer] Building UI for ${numShapes} blend shapes`);

            document.getElementById('total-shapes').textContent = numShapes;

            // Create control for each blend shape
            for (let i = 0; i < numShapes; i++) {
                const controlDiv = createBlendShapeControl(i, mainMesh);
                container.appendChild(controlDiv);
            }
        }

        function createBlendShapeControl(index, mesh) {
            const div = document.createElement('div');
            div.className = 'blend-shape-control';
            div.dataset.index = index;

            // Try to get name from dictionary (might not exist)
            const name = mesh.morphTargetDictionary ?
                Object.keys(mesh.morphTargetDictionary).find(key => mesh.morphTargetDictionary[key] === index) :
                null;

            const displayName = name || `Shape ${index}`;

            div.innerHTML = `
                <div class="blend-shape-header">
                    <div class="blend-shape-name">
                        <span class="index">#${index}</span>
                        ${displayName}
                    </div>
                    <div class="blend-shape-value" id="value-${index}">0.00</div>
                </div>
                <input type="range" class="blend-shape-slider" id="slider-${index}"
                       min="0" max="1" step="0.01" value="0" data-index="${index}">
                <div class="blend-shape-actions">
                    <button class="hide-btn" data-index="${index}">✕</button>
                    <button class="mark-btn" data-index="${index}">Mark as Mouth</button>
                    <button class="reset-btn" data-index="${index}">Reset</button>
                </div>
            `;

            // Slider event
            const slider = div.querySelector(`#slider-${index}`);
            slider.addEventListener('input', (e) => {
                const value = parseFloat(e.target.value);
                setBlendShapeValue(index, value);
                div.querySelector(`#value-${index}`).textContent = value.toFixed(2);
            });

            // Mark button
            const markBtn = div.querySelector('.mark-btn');
            markBtn.addEventListener('click', () => {
                toggleMark(index, div, markBtn);
            });

            // Reset button
            div.querySelector('.reset-btn').addEventListener('click', () => {
                slider.value = 0;
                setBlendShapeValue(index, 0);
                div.querySelector(`#value-${index}`).textContent = '0.00';
            });

            // Hide button
            div.querySelector('.hide-btn').addEventListener('click', () => {
                div.classList.add('hidden');
                updateHiddenCount();
            });

            return div;
        }

        function setBlendShapeValue(index, value) {
            // Set on all meshes with blend shapes
            blendShapeMeshes.forEach(mesh => {
                if (mesh.morphTargetInfluences && index < mesh.morphTargetInfluences.length) {
                    mesh.morphTargetInfluences[index] = value;
                }
            });
        }

        function toggleMark(index, div, button) {
            if (markedShapes.has(index)) {
                markedShapes.delete(index);
                div.classList.remove('marked');
                button.classList.remove('marked');
                button.textContent = 'Mark as Mouth';
            } else {
                markedShapes.add(index);
                div.classList.add('marked');
                button.classList.add('marked');
                button.textContent = '✓ Marked';
            }
            document.getElementById('marked-count').textContent = markedShapes.size;
        }

        function updateHiddenCount() {
            const hiddenCount = document.querySelectorAll('.blend-shape-control.hidden').length;
            document.getElementById('hidden-count').textContent = hiddenCount;
        }

        // ============================================
        // SEARCH
        // ============================================

        document.getElementById('search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const controls = document.querySelectorAll('.blend-shape-control');

            controls.forEach(control => {
                const name = control.querySelector('.blend-shape-name').textContent.toLowerCase();
                const index = control.dataset.index;

                if (name.includes(query) || index.includes(query)) {
                    control.style.display = 'block';
                } else {
                    control.style.display = 'none';
                }
            });
        });

        // ============================================
        // ACTIONS
        // ============================================

        document.getElementById('reset-all-btn').addEventListener('click', () => {
            const sliders = document.querySelectorAll('.blend-shape-slider');
            sliders.forEach(slider => {
                slider.value = 0;
                const index = parseInt(slider.dataset.index);
                setBlendShapeValue(index, 0);
                document.getElementById(`value-${index}`).textContent = '0.00';
            });
            console.log('[Explorer] Reset all blend shapes to 0');
        });

        document.getElementById('show-all-btn').addEventListener('click', () => {
            const hiddenControls = document.querySelectorAll('.blend-shape-control.hidden');
            hiddenControls.forEach(control => {
                control.classList.remove('hidden');
            });
            updateHiddenCount();
            console.log('[Explorer] Showed all hidden blend shapes');
        });

        document.getElementById('export-marked-btn').addEventListener('click', () => {
            if (markedShapes.size === 0) {
                alert('No shapes marked! Mark shapes that affect the mouth first.');
                return;
            }

            const marked = Array.from(markedShapes).sort((a, b) => a - b);
            const mainMesh = blendShapeMeshes[0];

            const exportData = {
                model: 'Alina',
                total_shapes: mainMesh.morphTargetInfluences.length,
                mouth_shapes: marked.map(index => {
                    const name = mainMesh.morphTargetDictionary ?
                        Object.keys(mainMesh.morphTargetDictionary).find(key => mainMesh.morphTargetDictionary[key] === index) :
                        null;
                    return {
                        index: index,
                        name: name || `Shape_${index}`
                    };
                })
            };

            console.log('[Explorer] Marked shapes:', exportData);

            // Download as JSON
            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'alina_mouth_shapes.json';
            a.click();
            URL.revokeObjectURL(url);

            alert(`Exported ${marked.length} mouth shapes to alina_mouth_shapes.json`);
        });

        // ============================================
        // ANIMATION LOOP
        // ============================================

        function animate() {
            requestAnimationFrame(animate);

            controls.update();
            renderer.render(scene, camera);

            // Update FPS
            frameCount++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                document.getElementById('fps').textContent = frameCount;
                frameCount = 0;
                lastTime = now;
            }
        }

        // ============================================
        // WINDOW RESIZE
        // ============================================

        window.addEventListener('resize', () => {
            camera.aspect = (window.innerWidth - 400) / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth - 400, window.innerHeight);
        });

        // ============================================
        // INIT
        // ============================================

        console.log('[Explorer] Starting Blend Shape Explorer...');
        initScene();
        loadModel();
        animate();
    </script>
</body>
</html>
